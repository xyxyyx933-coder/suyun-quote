<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苏银报价计算器 · Suyin Quote</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Crect%20width='100'%20height='100'%20rx='23'%20fill='%23d93a2b'/%3E%3Ctext%20x='50'%20y='74'%20font-size='64'%20text-anchor='middle'%20fill='%23fff'%20font-family='Microsoft%20YaHei,sans-serif'%3E%E8%8B%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f7;
  --card:#ffffff;
  --ink:#141b24;
  --ink2:#5a6672;
  --ink3:#929ca8;
  --line:#e2e6eb;
  --brand:#d93a2b;
  --brand-dk:#b62b1e;
  --brand-soft:#fdeeec;
  --ok:#0d8a5f;
  --ok-soft:#e8f6f0;
  --radius:14px;
  --shadow:0 1px 2px rgba(20,27,36,.05), 0 8px 24px -12px rgba(20,27,36,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.logo{
  width:38px;height:38px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,#e8543f,#c9291a);
  color:#fff;display:grid;place-items:center;
  font-size:19px;font-weight:700;letter-spacing:-1px;
  box-shadow:0 4px 12px -4px rgba(201,41,26,.55);
}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
.brand small{color:var(--ink3);font-size:11px;letter-spacing:.6px;text-transform:uppercase}

.seg-group{display:flex;background:#eef1f5;border-radius:10px;padding:3px;gap:2px}
.seg{
  border:0;background:transparent;padding:7px 15px;border-radius:8px;
  cursor:pointer;font-weight:550;color:var(--ink2);transition:.16s;white-space:nowrap;
}
.seg:hover{color:var(--ink)}
.seg.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(20,27,36,.12)}

/* 顶部模块导航 */
.nav-group{display:flex;background:#eef1f5;border-radius:10px;padding:3px;gap:2px}
.nav-tab{
  border:0;background:transparent;padding:7px 18px;border-radius:8px;
  cursor:pointer;font-weight:650;color:var(--ink2);transition:.16s;white-space:nowrap;
  font-size:13.5px;
}
.nav-tab:hover{color:var(--ink)}
.nav-tab.active{background:#fff;color:var(--brand-dk);box-shadow:0 1px 3px rgba(20,27,36,.12)}

.rate-refresh{border:0;background:transparent;color:var(--ink3);cursor:pointer;font-size:15px;padding:0 3px;line-height:1;transition:.15s}
.rate-refresh:hover{color:var(--brand);transform:rotate(90deg)}
.rate-refresh.busy{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#curSel{border:0;background:transparent;font-size:12.5px;color:var(--ink);cursor:pointer;font-family:inherit;padding:0 2px}
.rate-wrap{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:13px}
.rate-wrap input{
  width:74px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;
  background:#fafbfc;text-align:right;font-variant-numeric:tabular-nums;
}
.rate-wrap input:focus{outline:none;border-color:var(--brand);background:#fff}
.rate-wrap.hide{display:none}

/* ---------- 布局 ---------- */
.layout{
  display:grid;grid-template-columns:250px minmax(320px,1fr) 392px;
  gap:16px;padding:16px 22px 40px;align-items:start;
  max-width:1560px;margin:0 auto;
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{
  padding:13px 16px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.panel-h h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.3px;color:var(--ink2);text-transform:uppercase}
.panel-b{padding:14px 16px}

/* ---------- 产品目录 ---------- */
.cat-panel{position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto}
.cat-panel .panel-b{padding:10px 10px 16px}
.cat-title{
  font-size:11px;font-weight:650;color:var(--ink3);letter-spacing:.8px;
  padding:12px 8px 6px;text-transform:uppercase;
}
.prod{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:8px 10px;border-radius:9px;cursor:pointer;transition:.13s;
}
.prod:hover{background:#f6f8fa}
.prod.on{background:var(--brand-soft);border-color:#f6c9c3}
.prod .pn{font-size:13px;font-weight:500}
.prod.on .pn{color:var(--brand-dk);font-weight:600}
.prod .pp{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.prod.on .pp{color:var(--brand)}

/* ---------- 配置区 ---------- */
.empty{
  color:var(--ink3);text-align:center;padding:52px 20px;font-size:13.5px;line-height:1.9;
}
.empty .big{font-size:28px;display:block;margin-bottom:10px;opacity:.35}

.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:6px;letter-spacing:.2px}
.unit-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ub-label{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.2px}
.ub-seg{display:flex;background:#eef1f5;border-radius:8px;padding:2px;gap:2px}
.ub{
  border:0;background:transparent;padding:4px 11px;border-radius:6px;
  font-size:12px;cursor:pointer;color:var(--ink2);transition:.15s;font-weight:500;
}
.ub:hover{color:var(--ink)}
.ub.on{background:#fff;color:var(--brand);font-weight:650;box-shadow:0 1px 2px rgba(20,27,36,.13)}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:9px}
.row{display:flex;align-items:center;gap:8px}
.row .unit-tag{flex:1;min-width:0}
.row-x{color:var(--ink3);font-size:12px;flex:0 0 auto}
.row-del{
  width:30px;height:36px;flex:0 0 auto;border:0;border-radius:8px;
  background:#f1f4f7;color:#a6b0bb;cursor:pointer;font-size:16px;line-height:1;transition:.15s;
}
.row-del:hover{background:var(--brand-soft);color:var(--brand)}
.row-del:disabled{opacity:.3;cursor:not-allowed}
.row-add{
  width:100%;border:1px dashed #d5dbe3;background:#fbfcfd;color:var(--ink2);
  border-radius:9px;padding:8px;font-size:12.5px;cursor:pointer;font-weight:550;transition:.15s;
}
.row-add:hover{border-color:var(--brand);color:var(--brand);background:#fff8f7}
.input-row{display:flex;gap:10px;flex-wrap:wrap}
.input-row .field{flex:1 1 110px;margin-bottom:0}
.ctl{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fafbfc;font-variant-numeric:tabular-nums;transition:.15s;
}
.ctl:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(217,58,43,.09)}
.ctl-hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
.unit-tag{
  position:relative;
}
.unit-tag::after{
  content:attr(data-u);position:absolute;right:11px;top:50%;transform:translateY(-50%);
  font-size:11.5px;color:var(--ink3);pointer-events:none;
}
.unit-tag .ctl{padding-right:44px}

.price-line{
  display:flex;align-items:center;gap:8px;background:#f8fafb;
  border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;
}
.price-line .lbl{font-size:12px;color:var(--ink2);flex:0 0 auto}
.price-line input{width:88px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;text-align:right;font-variant-numeric:tabular-nums}
.price-line input:focus{outline:none;border-color:var(--brand)}
.price-line .rg{font-size:11px;color:var(--ink3);margin-left:auto;text-align:right;line-height:1.35}
.price-note{
  font-size:11.5px;color:var(--ink3);line-height:1.7;
  margin:-8px 0 14px;font-variant-numeric:tabular-nums;
}
/* 灯带 / 电源 */
.power-box{border:1px solid var(--line);border-radius:11px;margin-bottom:14px;Background:#fbfcfd;overflow:hidden}
.power-head{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:10px 13px;border:0;background:transparent;cursor:pointer;
  font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s;
}
.power-head:hover{background:#f2f6fa;color:var(--ink)}
.power-arrow{font-size:11px;font-weight:400;color:var(--ink3)}
.power-body{padding:2px 13px 13px}
.power-result{margin:2px 0 4px;font-size:12.5px}
.pw-row{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink2);font-variant-numeric:tabular-nums}
.pw-row b{color:var(--ink);font-weight:600}
.pw-row.hi b{color:var(--brand);font-size:15px}
.pw-hint{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.pw-tip{font-size:11px;color:var(--ink3);line-height:1.6;margin:-4px 0 8px}
.est-box{margin-top:14px;padding:11px 12px;background:#f8fafb;border:1px dashed #dfe5ec;border-radius:10px}
.est-title{font-size:11.5px;color:var(--ink3);margin-bottom:9px;line-height:1.5}
/* 导入设计稿 */
.cust-hint{padding:7px 16px;background:#fff9f8;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2);line-height:1.6}
.cust-hint b{color:var(--brand-dk);font-weight:650}
.cust-hint a{color:var(--brand);text-decoration:none;margin-left:6px}
.tpl-row{display:flex;gap:4px;margin-bottom:5px}
.tpl{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:1px}
.tpl:hover{border-color:var(--brand);background:var(--brand-soft)}
.tpl .pn{font-size:12.5px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl .pt{font-size:10.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tpl-del{width:24px;flex:0 0 auto;border:0;border-radius:7px;background:#f1f4f7;color:#a6b0bb;cursor:pointer;font-size:14px;transition:.15s}
.tpl-del:hover{background:var(--brand-soft);color:var(--brand)}
.import-row{margin-top:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.import-hint{font-size:11px;color:var(--ink3)}
.import-result{margin-top:10px;padding:10px 12px;background:#f8fafb;border:1px dashed #dfe5ec;border-radius:10px;font-size:12px;line-height:1.9}
.imp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.imp-row b{color:var(--brand-dk);font-weight:650}

.preview{
  background:linear-gradient(160deg,#fff8f7,#fdf2f0);
  border:1px solid #f7d9d4;border-radius:11px;padding:13px 15px;margin-bottom:14px;
}
.preview .formula{font-size:12.5px;color:#8a6259;font-variant-numeric:tabular-nums}
.preview .amt{
  font-size:26px;font-weight:680;color:var(--brand-dk);margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:-.5px;
}
.preview .amt small{font-size:14px;font-weight:500;margin-left:4px}

.btn{
  border:0;border-radius:9px;padding:10px 16px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px -5px rgba(217,58,43,.7)}
.btn-primary:hover{background:var(--brand-dk)}
.btn-primary:disabled{background:#d5dae0;box-shadow:none;cursor:not-allowed;transform:none}
.btn-ghost{background:#f1f4f7;color:var(--ink2)}
.btn-ghost:hover{background:#e7ebf0;color:var(--ink)}
.btn-block{width:100%}

/* ---------- 报价单 ---------- */
.quote-panel .panel-b{padding:0}
.q-head{
  padding:14px 16px 4px;
  display:flex;gap:10px;align-items:flex-end;
}
.q-head .field{margin-bottom:10px;min-width:0}
.q-head .field:first-child{flex:1 1 auto;max-width:340px}
.q-head .q-disc{flex:0 0 92px}
.q-head .q-disc .ctl{padding-right:30px}
.q-list{max-height:none}
.q-item{
  padding:11px 16px;border-top:1px solid var(--line);
  display:flex;gap:10px;align-items:flex-start;
  animation:slideIn .22s ease both;
}
@media (prefers-reduced-motion: reduce){ .q-item{animation:none} }
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.q-item .qi-main{flex:1;min-width:0}
.q-item .qi-name{font-size:13px;font-weight:600;margin-bottom:2px;word-break:break-word}
.q-item .qi-detail{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums;word-break:break-word}
.q-item .qi-amt{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px;flex:0 0 auto}
.q-del{
  border:0;background:transparent;color:#c3cbd3;cursor:pointer;font-size:16px;
  line-height:1;padding:2px 2px;border-radius:5px;flex:0 0 auto;
}
.q-del:hover{color:var(--brand);background:var(--brand-soft)}
.q-empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}

.q-foot{border-top:1px solid var(--line);padding:14px 16px;background:#fbfcfd;border-radius:0 0 var(--radius) var(--radius)}
.sum-line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);padding:3px 0;font-variant-numeric:tabular-nums}
.sum-line.big{
  font-size:19px;font-weight:700;color:var(--ink);padding-top:9px;margin-top:6px;
  border-top:1px dashed var(--line);
}
.sum-line.big .v{color:var(--brand-dk)}
.fee-input{
  width:78px;border:1px solid var(--line);border-radius:6px;background:#fff;
  padding:3px 8px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;transition:.15s;
}
.fee-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(217,58,43,.1)}
.opt-block{margin-top:12px;padding:11px 12px;background:#f8fafb;border:1px dashed #dfe5ec;border-radius:10px}
.opt-head{font-size:11.5px;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.opt-head span{font-size:11px;color:#a5aeb8}
.opt-out{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.9}
.opt-out b{color:var(--brand-dk);font-weight:700}
.calib-box{margin-top:4px;padding:11px 12px;background:#f8fafb;border:1px dashed #dfe5ec;border-radius:10px}
.calib-title{font-size:11.5px;color:var(--ink3);margin-bottom:9px;line-height:1.5}
.calib-result{margin-top:9px;font-size:11.5px;line-height:1.75;color:var(--ink2)}
.calib-result b{color:var(--brand-dk);font-weight:650}
.calib-item{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.calib-item:first-of-type{border-top:0;padding-top:0}
.profit-line{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--ink2);text-align:right}
.profit-line b{font-weight:700}
.total-note{font-size:11.5px;color:var(--ink3);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.gift{
  margin-top:10px;background:var(--ok-soft);color:var(--ok);border-radius:8px;
  padding:7px 11px;font-size:12px;font-weight:600;
}
.gift.hide{display:none}
.q-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.q-actions #btnText{grid-column:1 / -1}
.q-actions .btn{padding-left:10px;padding-right:10px}

/* ---------- 弹层 ---------- */
.mask{
  position:fixed;inset:0;background:rgba(17,24,32,.42);backdrop-filter:blur(2px);
  display:none;z-index:50;padding:24px;overflow:auto;
}
.mask.on{display:flex;align-items:center;justify-content:center}
.modal{
  background:#fff;border-radius:16px;width:min(620px,100%);max-height:88vh;
  display:flex;flex-direction:column;box-shadow:0 24px 60px -16px rgba(17,24,32,.4);
  animation:pop .22s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{margin:0;font-size:15px}
.modal-b{padding:16px 20px;overflow:auto}
.modal-b textarea{
  width:100%;height:340px;border:1px solid var(--line);border-radius:10px;
  padding:13px;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  font-size:12.5px;line-height:1.7;resize:vertical;background:#fafbfc;
}
.modal-b textarea:focus{outline:none;border-color:var(--brand)}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);
  background:#141b24;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;
  opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 24px -8px rgba(0,0,0,.5);
}
.toast.on{opacity:1;transform:translateX(-50%)}


/* ---------- A4 打印 / PDF 版（按公司 Quotation / PI 模板） ---------- */
.print-sheet{display:none}
@media print{
  @page{size:A4;margin:12mm 14mm}
  body>*{display:none !important}
  .print-sheet{display:block !important;font-family:"Arial","Microsoft YaHei",sans-serif;color:#000;font-size:10.5pt;line-height:1.5}
  .ps-company{font-size:15pt;font-weight:700;margin-bottom:2mm}
  .ps-title{font-size:12pt;font-weight:700;margin-bottom:4mm;letter-spacing:1px}
  .ps-intro{margin-bottom:4mm}
  .ps-meta{margin-bottom:4mm}
  .ps-meta div{margin-bottom:1mm}
  .ps-sell{width:100%;border-collapse:collapse;margin-bottom:5mm}
  .ps-sell td{vertical-align:top;padding:0 0 1mm}
  .ps-table{width:100%;border-collapse:collapse;margin-bottom:4mm}
  .ps-table th,.ps-table td{border:0.6pt solid #333;padding:2mm 1.5mm;vertical-align:top;font-size:9.5pt}
  .ps-table th{background:#f2f2f2;font-weight:700;text-align:center;line-height:1.35}
  .ps-table td.c{text-align:center}
  .ps-table td.r{text-align:right;white-space:nowrap}
  .ps-img{min-height:26mm}
  .ps-plain th,.ps-plain td{border:0}
  .ps-plain td{padding:1.5mm 0;font-size:10pt}
  .ps-opt{font-size:10pt;line-height:1.9;margin:3mm 0 5mm}
  .ps-opt b{float:right}
  .ps-total{text-align:right;font-size:11pt;font-weight:700;margin:3mm 0 5mm}
  .ps-notes{font-size:9pt;line-height:1.7}
  .ps-notes b{display:block;margin-bottom:1mm}
  .ps-sign{text-align:right;margin-top:12mm;font-size:9.5pt;line-height:1.8}
}

/* ---------- 历史记录 ---------- */
.btn-hist{
  border:1px solid var(--line);background:#fff;color:var(--ink2);
  padding:7px 13px;border-radius:9px;font-size:13px;font-weight:550;
  cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-hist:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.hist-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:8px;transition:.15s;background:#fff;
}
.hist-item:hover{border-color:#ccd5df;background:#fafbfc}
.hist-main{flex:1;min-width:0}
.hist-date{font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.hist-cust{font-size:13.5px;font-weight:600;margin:1px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-badge{border:0;border-radius:20px;padding:2px 9px;font-size:10.5px;cursor:pointer;margin-left:6px;transition:.15s;vertical-align:middle}
.st-pending{background:#eef4fb;color:#4a6fa5}
.st-stale{background:#fdf0e3;color:#c07a3a}
.st-won{background:#e6f6ec;color:#1f9d55}
.st-lost{background:#f2f4f7;color:#98a2b0}
.hist-meta{font-size:11.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-amt{font-size:14px;font-weight:680;color:var(--brand-dk);white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.hist-empty{padding:44px 20px;text-align:center;color:var(--ink3);font-size:13px;line-height:1.9}

/* ---------- 包装 / 重量 ---------- */
.pack-box{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}
.pack-head{
  width:100%;display:flex;justify-content:space-between;align-items:center;
  border:0;background:transparent;cursor:pointer;padding:1px 0 5px;
  font-size:12.5px;font-weight:600;color:var(--ink2);transition:.15s;
}
.pack-head:hover{color:var(--ink)}
.pack-arrow{font-size:11px;font-weight:400;color:var(--ink3)}
.pack-body{padding-top:3px}
.pack-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-bottom:10px}
.pack-grid .field{margin-bottom:0;min-width:0}
.pack-grid label{font-size:11px;margin-bottom:4px}
.pack-grid .ctl{padding:7px 10px;font-size:13px}
.pk-opt{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);margin-bottom:10px;cursor:pointer}
.pk-opt input{margin:0;cursor:pointer}
.pk-box{font-size:11.5px;color:var(--ink2);line-height:1.75}
.pack-result{font-size:12px;color:var(--ink2);line-height:1.95;font-variant-numeric:tabular-nums;margin-bottom:10px}
.pack-result b{color:var(--ink);font-weight:650}
.pack-result .hi b{color:var(--brand-dk);font-size:13.5px}

/* ---------- 响应式 ---------- */
/* 1240 以下：三栏收紧 */
@media (max-width:1300px){
  .layout{grid-template-columns:222px minmax(280px,1fr) 344px;gap:12px;padding:14px 16px 36px}
}
/* 1080 以下：左目录固定，右侧配置 + 报价单上下堆叠 */
@media (max-width:1080px){
  .layout{
    grid-template-columns:222px minmax(0,1fr);
    grid-template-areas:"cat build" "cat quote";
    gap:12px;padding:14px 16px 36px;
  }
  .cat-panel{grid-area:cat;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
  .build-panel{grid-area:build}
  .quote-panel{grid-area:quote}
  .q-list{max-height:44vh;overflow:auto}
}
/* 840 以下：单栏堆叠 */
@media (max-width:840px){
  .layout{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"cat" "build" "quote";
    padding:12px 12px 24px;
  }
  .cat-panel{position:static;max-height:260px;align-self:stretch}
  .q-list{max-height:none}
  .q-head .field:first-child{max-width:none}
  .topbar{padding:11px 14px;gap:10px}
  .brand h1{font-size:15px}
  .brand small{display:none}
  .seg{padding:6px 11px;font-size:13px}
}

/* ---------- 打印 ---------- */
@media print{
  body{background:#fff}
  .topbar,.cat-panel,.build-panel,.q-actions,.q-del,.mask,.toast{display:none !important}
  .layout{display:block;padding:0;max-width:none}
  .panel{border:0;box-shadow:none}
  .quote-panel{width:100%}
  .q-foot{background:#fff}
}

/* ===================== 视觉优化 v2：现代商务 ===================== */

/* 1. 背景分层：让卡片浮起来 */
body{background:#eaeef3}

/* 2. 顶栏深色：建立工具边界 */
.topbar{
  background:#1a2330;border-bottom:1px solid #0f1620;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px -12px rgba(15,22,32,.6);
  padding:13px 22px;
}
.brand h1{color:#f2f5f9;font-weight:640;letter-spacing:.01em}
.brand small{color:#7f8fa3}
.brand svg,.brand img{filter:none}

/* 分段切换（内销/外贸） */
.seg-group{background:#26313f;border:1px solid #332f3f;border-radius:11px;padding:3px}
.seg{color:#93a2b4;font-weight:520;border-radius:8px;transition:.16s}
.seg:hover{color:#d5dee8}
.seg.active{background:#fff;color:#b62b1e;box-shadow:0 2px 8px -2px rgba(0,0,0,.45)}

/* 汇率区 */
.rate-wrap{background:#26313f;border:1px solid #332f3f;border-radius:11px;color:#93a2b4;padding:5px 10px;gap:6px}
#curSel{color:#e6edf5;font-weight:560}
.rate-wrap input{background:transparent;border:0;color:#fff;font-weight:560;width:62px;padding:2px 0}
.rate-wrap input:focus{background:transparent;box-shadow:none}
.rate-refresh{color:#93a2b4}
.rate-refresh:hover{color:#ff8072}

/* 历史记录按钮 */
.btn-hist{background:#26313f;border:1px solid #332f3f;color:#c6d2de;border-radius:11px}
.btn-hist:hover{background:#2f3c4c;color:#fff;border-color:#465569}

/* 3. 面板：拉开层次，报价单最重 */
.panel{
  box-shadow:0 1px 2px rgba(20,27,36,.04), 0 14px 34px -20px rgba(20,27,36,.35);
  border-color:#e6ebf0;
}
.quote-panel{
  border-color:#f0dfdb;
  box-shadow:0 1px 2px rgba(182,43,30,.05), 0 18px 44px -22px rgba(182,43,30,.28);
  position:relative;
}
.quote-panel::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand) 0%,#f08a7a 100%);
  border-radius:var(--radius) 0 0 var(--radius);
}

/* 4. 面板内边距与标题 */
.panel-h{padding:15px 17px 12px;border-bottom:1px solid #eef1f5}
.panel-h h2{font-size:13.5px;font-weight:660;letter-spacing:.01em;color:#2b3746}
.panel-h .sub{font-size:11.5px;color:#94a0ad}

/* 5. 产品列表：加大呼吸感，选中态用色条 */
.cat-group{margin-bottom:4px}
.cat-title{
  font-size:10.5px;font-weight:640;color:#8a97a6;letter-spacing:.06em;
  text-transform:uppercase;padding:12px 4px 7px;border:0;background:none;
}
.prod{padding:9px 11px;border-radius:9px;transition:background .14s,border-color .14s}
.prod:hover{background:#f4f7fa;border-color:#e4eaf0}
.prod.on{
  background:#fff5f3;border-color:#f5cbc4;
  box-shadow:inset 3px 0 0 var(--brand), 0 1px 3px rgba(182,43,30,.08);
}
.prod .pn{font-size:12.8px;font-weight:540;color:#26313f;line-height:1.35}
.prod .pp{font-size:11px;color:#96a2b0;font-weight:500}
.prod.on .pp{color:var(--brand);font-weight:600}

/* 6. 表单：更厚实的输入 */
.field label{font-size:11.8px;font-weight:540;color:#6b7887;margin-bottom:5px;letter-spacing:.01em}
.ctl{padding:10px 12px;border-radius:9px;border-color:#dfe5ec;background:#fbfcfd;font-size:13.5px;transition:border-color .14s,box-shadow .14s,background .14s}
.ctl:hover{border-color:#cdd6e0}
.ctl:focus{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3px rgba(217,58,43,.1)}
.unit-tag input{padding:10px 12px}
.row{padding:2px 0}
.row-x{color:#b6c0cc}

/* 7. 分段按钮（单位切换） */
.unit-bar{background:#eef2f6;border-radius:10px;padding:3px}
.ub{color:#7b8896;border-radius:7px;font-size:12px;font-weight:530}
.ub.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(20,27,36,.14)}

/* 8. 合计：最重的一个数字 */
.sum-line{font-size:12.8px;padding:4px 0}
.sum-line.big{
  font-size:15px;font-weight:600;color:#4a5765;
  padding-top:12px;margin-top:9px;border-top:1px solid #eef1f5;
}
.sum-line.big .v{
  font-size:25px;font-weight:720;color:var(--brand-dk);
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
}

/* 9. 报价单条目 */
.q-item{padding:13px 0;border-bottom:1px solid #f1f4f7}
.q-item:first-child{padding-top:4px}
.q-name{font-size:13px;font-weight:600;color:#26313f}
.q-spec{font-size:11.5px;color:#8e9aa8;margin-top:2px}
.q-formula{font-size:11px;color:#a3aebb}
.q-amt{font-size:14.5px;font-weight:680;color:#2b3746;font-variant-numeric:tabular-nums}

/* 10. 按钮统一 */
.btn{border-radius:9px;font-weight:560;transition:background .14s,border-color .14s,box-shadow .14s,transform .1s}
.btn:active{transform:translateY(.5px)}
.btn-primary{box-shadow:0 6px 16px -8px rgba(217,58,43,.75)}
.btn-ghost{border-color:#dfe5ec;color:#5c6a78;background:#fff}
.btn-ghost:hover{border-color:#c9d3de;background:#f8fafc;color:#2b3746}

/* 11. 包装/校准等辅助块：退后一层 */
.pack-box,.opt-block{background:#f7f9fb;border-radius:11px;border-color:#e7ecf1}
.pack-head{font-size:12.5px;font-weight:600;color:#4a5765}
.opt-head{color:#8e9aa8}

/* 12. 预览卡 */
.preview{background:linear-gradient(180deg,#fbfcfd 0%,#f5f8fa 100%);border-color:#e7ecf1}
.preview .amt{font-size:27px;letter-spacing:-.025em}

/* 13. 移动端：单栏时去掉色条、加大点击区 */
@media (max-width:840px){
  body{background:#f0f3f7}
  .quote-panel::before{display:none}
  .prod{padding:11px 12px}
  .ctl{padding:11px 12px;font-size:14px}
  .sum-line.big .v{font-size:24px}
  .topbar{padding:11px 14px;gap:10px}
}


/* 14. 窄屏（≤560px）防溢出与重排 */
@media (max-width:560px){
  /* 顶栏：品牌独占一行，其余并排 */
  .topbar{padding:10px 12px;gap:8px 10px}
  .brand{flex:1 1 100%;margin-right:0}
  .brand h1{font-size:15px}
  .seg-group{flex:1 1 auto;min-width:0}
  .seg{flex:1;justify-content:center;padding:7px 6px;font-size:12.5px}
  .rate-wrap{flex:1 1 100%;justify-content:space-between}
  .btn-hist{flex:0 1 auto;padding:7px 10px;font-size:12px}

  /* 面板内边距收紧 */
  .layout{padding:10px 10px 28px}
  .panel-h{padding:12px 13px 10px}
  .build-panel,.quote-panel{padding:13px}

  /* 产品项：价格不再被挤掉，窄了就换行 */
  .prod{flex-wrap:wrap;gap:2px 8px}
  .prod .pn{flex:1 1 auto;min-width:0}
  .prod .pp{flex:0 0 auto;margin-left:auto}

  /* 尺寸行：内容多就换行，别撑破 */
  .row{flex-wrap:wrap;gap:5px}
  .row .unit-tag{flex:1 1 62px;min-width:0}
  .row-x{flex:0 0 auto}
  .row-del{flex:0 0 auto}

  /* 表单栅格改单列 */
  .input-row{flex-wrap:wrap;gap:8px}
  .input-row .field,.pack-grid .field{flex:1 1 46%;min-width:0}
  .pack-grid{grid-template-columns:1fr 1fr}
  .q-actions{grid-template-columns:1fr 1fr}

  /* 合计金额占比更大 */
  .sum-line.big .v{font-size:23px}

  /* 分段按钮组不被压扁 */
  .unit-bar{flex-wrap:wrap}
  .ub{flex:1 1 auto;text-align:center;padding:6px 8px}

  /* 面板副标题窄屏隐藏，避免截断 */
  .panel-h .sub{display:none}
  .field label{font-size:11.5px}
}

/* 15. 全局防横向滚动 */
html,body{overflow-x:hidden}
.layout>*,.panel{min-width:0}
.prod,.q-item{min-width:0}
.ctl,.unit-tag{min-width:0}


/* 16. 小屏精修：三处溢出 */
@media (max-width:560px){
  /* 历史记录只留图标，避免挤掉 */
  .btn-hist{flex:0 0 auto;font-size:0;padding:9px 11px;line-height:1}
  .btn-hist span{font-size:15px}

  /* 产品项：名称省略号、价格不换行不掉 */
  .prod{flex-wrap:nowrap;gap:8px}
  .prod .pn{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prod .pp{flex:0 0 auto;margin-left:auto;white-space:nowrap}

  /* 尺寸行：输入框自适应，单位标签不撑破 */
  .row{flex-wrap:nowrap;gap:4px}
  .row .unit-tag{flex:1 1 0;min-width:0;padding:0}
  .row .unit-tag input{width:100%;min-width:0;padding:9px 4px;text-align:center;font-size:13px}
  .row .unit-tag::after{font-size:10px;padding:0 3px}
  .row-x{font-size:11px}
  .row-del{flex:0 0 22px;width:22px;height:22px}
}

/* 17. 极小屏（≤400px）：尺寸行两列排 */
@media (max-width:400px){
  .row{flex-wrap:wrap}
  .row .unit-tag{flex:1 1 42%}
  .row-x{flex:0 0 10px;text-align:center}
}

/* ===================== 视觉精修 v3：精致度提升 ===================== */

/* —— 全局背景微渐变 + 顶栏品牌图标 —— */
body{
  background:
    radial-gradient(1200px 500px at 12% -8%, rgba(217,58,43,.05), transparent 60%),
    radial-gradient(900px 460px at 100% 0%, rgba(33,150,243,.04), transparent 55%),
    #eaeef3;
}
.logo{
  background:linear-gradient(135deg,#f2785f 0%,#d93a2b 52%,#b62b1e 100%);
  box-shadow:0 4px 14px -5px rgba(201,41,26,.6), inset 0 1px 0 rgba(255,255,255,.28);
  font-weight:800;
}
.brand h1{letter-spacing:.2px}
.brand small{font-size:10.5px;letter-spacing:.5px}

/* 顶栏细分段控件：更精致的胶囊 */
.seg-group{box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.seg{padding:7px 16px;font-size:13px;font-weight:540;letter-spacing:.3px}
.seg.active{font-weight:640}
.rate-wrap{box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}

/* —— 面板标题小图标 —— */
.panel-h h2{display:flex;align-items:center;gap:7px}
.panel-h h2::before{
  content:'';width:7px;height:7px;border-radius:2.5px;flex:0 0 auto;
  background:var(--brand);box-shadow:0 0 0 3px rgba(217,58,43,.12);
}
.cat-panel .panel-h h2::before{background:#6b7887;box-shadow:0 0 0 3px rgba(107,120,135,.14)}
.quote-panel .panel-h h2::before{background:var(--brand);box-shadow:0 0 0 3px rgba(217,58,43,.14)}
.build-panel .panel-h h2::before{background:#1f9d55;box-shadow:0 0 0 3px rgba(31,157,85,.14)}

/* —— 分类标题图标锚点 —— */
.cat-title{display:flex;align-items:center;gap:7px}
.cat-ico{
  width:20px;height:20px;border-radius:6px;flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:10.5px;font-weight:700;color:var(--brand);
  background:var(--brand-soft);line-height:1;letter-spacing:0;
}

/* —— 产品项：序号圆点 + 更明确的选中态 —— */
.prod{position:relative;padding:9px 11px 9px 12px}
.prod::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%) scale(0);
  width:3px;height:16px;border-radius:2px;background:var(--brand);
  transition:transform .16s;
}
.prod.on::before{transform:translateY(-50%) scale(1)}
.prod.on{box-shadow:none}
.prod .pp{font-variant-numeric:tabular-nums}

/* —— 报价单合计区：金额卡更醒目 —— */
.sum-line.big{
  background:linear-gradient(180deg,#fdfbfa 0%,#fbf4f2 100%);
  border:1px solid #f4ddd7;border-radius:11px;
  padding:11px 14px;margin-top:12px;
}
.sum-line.big .v{
  font-size:26px;font-weight:750;
  background:linear-gradient(180deg,#d93a2b,#b62b1e);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* —— 主按钮：渐变 + 更细腻阴影 —— */
.btn-primary{
  background:linear-gradient(180deg,#e24a39 0%,#d93a2b 55%,#c9291a 100%);
  box-shadow:0 6px 16px -6px rgba(217,58,43,.65), inset 0 1px 0 rgba(255,255,255,.2);
  font-weight:620;
}
.btn-primary:hover{
  background:linear-gradient(180deg,#ea5645 0%,#e04a39 55%,#d53221 100%);
  box-shadow:0 8px 20px -7px rgba(217,58,43,.75), inset 0 1px 0 rgba(255,255,255,.22);
}
.btn-ghost{font-weight:550;color:#5c6a78}

/* —— 输入框聚焦更柔和 —— */
.ctl:focus{box-shadow:0 0 0 3.5px rgba(217,58,43,.11)}

/* —— 报价单条目 hover 反馈 —— */
.q-item{transition:background .14s}
.q-item:hover{background:#fbfcfd}

/* —— 自定义滚动条（WebKit） —— */
.cat-panel::-webkit-scrollbar,
.q-list::-webkit-scrollbar,
.modal-b::-webkit-scrollbar{width:8px;height:8px}
.cat-panel::-webkit-scrollbar-thumb,
.q-list::-webkit-scrollbar-thumb,
.modal-b::-webkit-scrollbar-thumb{
  background:#ccd5df;border-radius:8px;
}
.cat-panel::-webkit-scrollbar-thumb:hover,
.q-list::-webkit-scrollbar-thumb:hover,
.modal-b::-webkit-scrollbar-thumb:hover{background:#b7c3cf}
.cat-panel::-webkit-scrollbar-track,
.q-list::-webkit-scrollbar-track,
.modal-b::-webkit-scrollbar-track{background:transparent}

/* —— 弹层更圆润 —— */
.modal{border-radius:18px}

/* —— 历史按钮图标更清晰 —— */
.btn-hist span{filter:none}

/* —— 状态徽章圆角统一 —— */
.st-badge{border-radius:99px;font-weight:600}

/* —— 折叠头 hover 图标 —— */
.pack-head:hover .pack-arrow,
.power-head:hover .power-arrow{color:var(--brand)}

/* ===================== 视觉规范 v4：简约 · 低饱和 · 全圆角 =====================
   主色：低饱和陶土红 #C0564F；顶栏：白色；圆角：8/12/16 三档
   ========================================================================= */

/* —— 1. 全局令牌重定义（低饱和柔和） —— */
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --ink:#2f3437;
  --ink2:#6b7280;
  --ink3:#9ca3af;
  --line:#e5e7eb;
  --brand:#c0564f;
  --brand-dk:#a8483f;
  --brand-soft:#f6e8e6;
  --ok:#7c9a6d;
  --ok-soft:#eef3eb;
  --radius:12px;
  --shadow:0 2px 12px rgba(47,52,55,.06);
}

/* —— 2. 全局背景：纯暖灰，去掉 v3 的彩色光晕 —— */
body{
  background:#f4f5f7;
  color:var(--ink);
}

/* —— 3. 顶栏：深色改白，底部细分隔线 —— */
.topbar{
  background:#ffffff;
  border-bottom:1px solid var(--line);
  box-shadow:0 1px 0 rgba(47,52,55,.02);
  padding:12px 22px;
}
.brand h1{color:var(--ink);font-weight:600}
.brand small{color:var(--ink3)}

/* logo：低饱和陶土红渐变 */
.logo{
  background:linear-gradient(135deg,#d27b70 0%,#c0564f 55%,#a8483f 100%);
  box-shadow:0 2px 8px -2px rgba(192,86,79,.5), inset 0 1px 0 rgba(255,255,255,.3);
  border-radius:10px;
  font-weight:700;
}

/* 分段切换：浅灰底胶囊，白顶栏内 */
.seg-group{background:#f1f3f5;border:0;border-radius:10px;padding:3px;box-shadow:none}
.seg{color:var(--ink2);font-weight:500;border-radius:8px;padding:6px 15px}
.seg:hover{color:var(--ink)}
.seg.active{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(47,52,55,.1);font-weight:600}

/* 汇率区：浅灰底 */
.rate-wrap{background:#f1f3f5;border:0;border-radius:10px;color:var(--ink2);padding:5px 10px;box-shadow:none}
#curSel{color:var(--ink);font-weight:500}
.rate-wrap input{background:transparent;border:0;color:var(--ink);font-weight:500;width:62px;padding:2px 0}
.rate-wrap input:focus{background:transparent;box-shadow:none}
.rate-refresh{color:var(--ink3)}
.rate-refresh:hover{color:var(--brand)}

  border:1px solid rgba(255,255,255,.82);
  border-radius:14px;
  box-shadow:inset 0 1px 0 #fff;
}
.pack-box{border-top:1px dashed rgba(120,70,40,.16)}
.pk-box,.pack-result,.est-box,.power-box,.calib-box,.preview,.import-result{
  background:rgba(255,255,255,.8);
  border:1px solid rgba(255,255,255,.82);
  border-radius:13px;
  box-shadow:inset 0 1px 0 #fff;
}
.preview{background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(252,247,243,.85));border-color:rgba(239,75,52,.16)}
.preview .formula{color:#8A6259}
.cust-hint{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.82);border-radius:12px}
.cust-drop{
  background:rgba(255,255,255,.9);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid rgba(255,255,255,.9);border-radius:14px;
  box-shadow:0 20px 44px -20px rgba(120,58,26,.4);
}
.cust-drop-item:hover{background:rgba(255,240,230,.7)}
.opt-out{background:rgba(255,247,240,.7);border:1px solid rgba(239,75,52,.16);border-radius:11px}

/* ---------- 弹层 ---------- */
.mask{background:rgba(58,32,18,.34);backdrop-filter:blur(8px) saturate(140%);-webkit-backdrop-filter:blur(8px)}
.modal{
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,247,241,.92));
  border:1px solid rgba(255,255,255,.92);
  border-radius:22px;
  box-shadow:0 34px 80px -28px rgba(90,40,15,.5), inset 0 1px 0 #fff;
}
.modal-h{border-bottom:1px solid rgba(120,70,40,.12)}
.modal-b textarea{
  background:rgba(255,255,255,.82);border:1px solid rgba(120,70,40,.14);border-radius:13px;
}
.modal-b textarea:focus{border-color:rgba(239,75,52,.5);box-shadow:0 0 0 3px rgba(255,138,80,.16)}
.toast{
  background:rgba(40,24,14,.9);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.14);border-radius:13px;
  box-shadow:0 16px 40px -18px rgba(40,24,14,.7);
}

/* ---------- 历史记录 / 客户 ---------- */
.hist-item{
  background:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.85);
  border-radius:14px;
  box-shadow:inset 0 1px 0 #fff;
}
.hist-item:hover{background:rgba(255,255,255,.82);border-color:rgba(239,75,52,.22)}
.hist-tabs{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.82);border-radius:11px;padding:3px}
.hist-tab.active{
  background:linear-gradient(135deg,#fff,#FFF0E4);color:var(--brand-dk);
  box-shadow:0 4px 12px -7px rgba(239,75,52,.6);
}
.cust-card{
  background:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.85);
  border-radius:16px;
  box-shadow:0 10px 30px -20px rgba(120,58,26,.35), inset 0 1px 0 #fff;
}
.cust-card:hover{background:rgba(255,255,255,.82);border-color:rgba(239,75,52,.2)}
.cust-tag,.tag-chip{
  background:rgba(255,255,255,.72);
  border:1px solid rgba(120,70,40,.12);
  border-radius:9px;
}
.tag-chip.on{
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -8px rgba(239,75,52,.8);
}
.cs-item{
  background:linear-gradient(135deg,rgba(255,255,255,.92),rgba(253,249,245,.85));
  border:1px solid rgba(255,255,255,.88);
  border-radius:16px;
  box-shadow:0 10px 28px -20px rgba(120,58,26,.35), inset 0 1px 0 #fff;
}
.cs-val{color:var(--accent-d)}
.cust-view-head{background:transparent}
.cust-view-actions .ctl{background:rgba(255,255,255,.72)}

/* ---------- 滚动条 ---------- */
.cat-panel::-webkit-scrollbar,.modal-b::-webkit-scrollbar{width:9px}
.cat-panel::-webkit-scrollbar-thumb,.modal-b::-webkit-scrollbar-thumb{
  background:rgba(239,75,52,.2);border-radius:9px;border:2px solid transparent;background-clip:content-box;
}
.cat-panel::-webkit-scrollbar-thumb:hover,.modal-b::-webkit-scrollbar-thumb:hover{background:rgba(239,75,52,.36);background-clip:content-box}

/* ---------- 打印单保持白纸黑字 ---------- */
.opt-head{gap:10px}
.opt-head span{white-space:nowrap}
.print-sheet,.ps-table,.ps-plain{background:#fff!important;backdrop-filter:none!important}

</style>
</head>
<body data-version="1.22.2">

<header class="topbar">
  <div class="brand">
    <span class="logo">苏</span>
    <div>
      <h1>苏银报价计算器</h1>
      <small>Hefei Suyin Advertising · v<span id="appVer">1.22.0</span></small>
    </div>
  </div>
  <div class="nav-group" id="navGroup">
    <button class="nav-tab active" data-view="customers">客户管理</button>
    <button class="nav-tab" data-view="quote">报价计算</button>
  </div>
  <div class="seg-group" id="modeGroup">
    <button class="seg active" data-mode="domestic">内销 · CNY</button>
    <button class="seg" data-mode="export">外贸 · USD</button>
  </div>
  <label class="rate-wrap hide" id="rateWrap">
    <select id="curSel" title="报价币种">
      <option value="USD">USD · 美元</option>
      <option value="EUR">EUR · 欧元</option>
      <option value="GBP">GBP · 英镑</option>
      <option value="AUD">AUD · 澳元</option>
      <option value="CAD">CAD · 加元</option>
      <option value="JPY">JPY · 日元</option>
      <option value="AED">AED · 迪拉姆</option>
      <option value="SAR">SAR · 里亚尔</option>
      <option value="INR">INR · 印度卢比</option>
      <option value="PKR">PKR · 巴基斯坦卢比</option>
      <option value="BDT">BDT · 孟加拉塔卡</option>
      <option value="RUB">RUB · 卢布</option>
      <option value="PLN">PLN · 波兰兹罗提</option>
    </select>
    <input type="number" id="rateInput" value="7.15" step="0.01" min="0.0001" title="1 单位外币 = 多少人民币">
    <button type="button" class="rate-refresh" id="btnRate" title="获取实时汇率">↻</button>
  </label>
  <button class="btn-hist" id="btnCheckUpdate">
    <span style="font-size:14px;line-height:1">🔄</span> 检查更新
  </button>
  <button class="btn-hist" id="btnHistory">
    <span style="font-size:14px;line-height:1">⏱</span> 历史记录
  </button>
</header>

<div class="view" id="viewQuote" hidden>
<div class="layout">

  <!-- 左：产品目录 -->
  <aside class="panel cat-panel">
    <div class="panel-h"><h2>产品目录</h2></div>
    <div class="panel-b" id="catalog"></div>
  </aside>

  <!-- 中：配置 -->
  <section class="panel build-panel">
    <div class="panel-h"><h2>计价配置</h2><span id="curUnit" style="font-size:11.5px;color:var(--ink3)"></span></div>
    <div class="panel-b" id="builder">
      <div class="empty">
        <span class="big">◧</span>
        从左侧选一个产品<br>输入尺寸和数量即可算出价格
      </div>
    </div>
  </section>

  <!-- 右：报价单 -->
  <section class="panel quote-panel">
    <div class="panel-h">
      <h2>报价单</h2>
      <span class="q-head-right">
        <span id="saveState" class="save-state">—</span>
        <span id="itemCount" style="font-size:11.5px;color:var(--ink3)">0 项</span>
      </span>
    </div>
    <div class="q-head">
      <div class="field">
        <label>客户名称 / Customer</label>
        <input class="ctl" id="customer" placeholder="选填" autocomplete="off">
        <div class="cust-drop" id="custDrop" hidden></div>
      </div>
      <div class="field q-disc">
        <label title="70 = 打 7 折，120 = 加 20% 利润">价格系数</label>
        <div class="unit-tag" data-u="%">
          <input class="ctl" type="number" id="factor" value="100" min="10" max="500" step="5">
        </div>
      </div>
    </div>
    <div class="cust-hint" id="custHint" hidden></div>
    <div class="q-list" id="quoteList">
      <div class="q-empty">还没有项目<br>算好一个就点「加入报价单」</div>
    </div>
    <div class="q-foot">
      <div class="sum-line"><span>小计</span><span class="v" id="subtotal">¥0.00</span></div>
      <div class="sum-line fee-line">
        <span>包装费</span>
        <span class="v" style="display:flex;align-items:center;gap:5px">
          <input class="fee-input" type="number" id="packFee" value="0" min="0" step="10">
          <span style="font-size:12px;color:var(--ink3)" id="feeUnit">元</span>
        </span>
      </div>
      <div class="sum-line fee-line">
        <span>成本</span>
        <span class="v" style="display:flex;align-items:center;gap:5px">
          <input class="fee-input" type="number" id="costInput" value="0" min="0" step="50" placeholder="0">
          <span style="font-size:12px;color:var(--ink3)">元</span>
        </span>
      </div>
      <div class="sum-line big"><span>合计</span><span class="v" id="total">¥0.00</span></div>
      <div class="total-note" id="totalNote" style="display:none"></div>
      <div class="profit-line" id="profitLine" style="display:none"></div>
      <div class="sum-line" id="cnyLine" style="display:none"><span>折人民币</span><span class="v" id="cnyTotal">¥0.00</span></div>
      <div class="gift hide" id="giftTip">🎁 满 1000 元，赠送总电源 1 台</div>

      <div class="opt-block" id="optBlock">
        <div class="opt-head">双物流报价（可选）<span>填运费后自动出两个总价</span>
          <button type="button" class="btn btn-ghost" id="btnFillFreight" style="margin-left:auto;padding:4px 10px;font-size:11.5px" title="把「国际运费报价」页最新算出的渠道报价填到 A / B">↙ 填入最新运费</button>
        </div>
        <div class="opt-terms">
          <label class="opt-term-item">贸易方式
            <select class="ctl" id="incotermSel">
              <option value="DDP">DDP（完税后交货）</option>
              <option value="EXW">EXW（工厂交货）</option>
              <option value="CIF">CIF（到岸价）</option>
              <option value="FOB">FOB（离岸价）</option>
              <option value="DAP">DAP（目的地交货）</option>
            </select>
          </label>
        </div>
        <div class="sum-line fee-line">
          <span class="opt-label">Option A</span>
          <span class="v" style="display:flex;align-items:center;gap:5px">
            <select class="opt-mode" id="frAMode">
              <option value="sea">海运 Sea</option>
              <option value="fast">快船 Fast Sea</option>
              <option value="air">空运 Air</option>
              <option value="dhl">国际快递 DHL</option>
              <option value="fedex">国际快递 FedEx</option>
              <option value="ups">国际快递 UPS</option>
              <option value="express">国际快递 Express</option>
            </select>
            <span class="opt-days"><input class="fee-input days-input" type="text" id="frADays" placeholder="30–35"><span>天</span></span>
            <input class="fee-input" type="number" id="frA" value="0" min="0" step="50" placeholder="0">
            <span style="font-size:12px;color:var(--ink3)">元</span>
          </span>
        </div>
        <div class="sum-line fee-line">
          <span class="opt-label">Option B</span>
          <span class="v" style="display:flex;align-items:center;gap:5px">
            <select class="opt-mode" id="frBMode">
              <option value="sea">海运 Sea</option>
              <option value="fast">快船 Fast Sea</option>
              <option value="air" selected>空运 Air</option>
              <option value="dhl">国际快递 DHL</option>
              <option value="fedex">国际快递 FedEx</option>
              <option value="ups">国际快递 UPS</option>
              <option value="express">国际快递 Express</option>
            </select>
            <span class="opt-days"><input class="fee-input days-input" type="text" id="frBDays" placeholder="5–8"><span>天</span></span>
            <input class="fee-input" type="number" id="frB" value="0" min="0" step="50" placeholder="0">
            <span style="font-size:12px;color:var(--ink3)">元</span>
          </span>
        </div>
        <div class="opt-out" id="optOut" hidden></div>
      </div>

      <div class="pack-box">
        <button class="pack-head" id="packToggle">
          <span>包装 / 重量</span>
          <span class="pack-arrow" id="packArrow">展开 ▼</span>
        </button>
        <div class="pack-body" id="packBody" hidden>
          <label class="pk-opt"><input type="checkbox" id="pkAuto" checked> 随报价单自动估算（手动改下面的数就会关掉）</label>
          <div class="pack-grid" style="margin-bottom:8px">
            <div class="field"><label>包装方式</label>
              <select class="ctl" id="pkMat"><option value="crate">木箱（含叉车脚）</option><option value="carton">纸箱</option></select></div>
            <div class="field"><label>体积重 ÷</label>
              <select class="ctl" id="pkDiv"><option value="5000">5000（快递，偏保守）</option><option value="6000">6000（空运）</option></select></div>
            <div class="field"><label>箱数</label>
              <select class="ctl" id="pkFixed">
                <option value="1">优先 1 箱</option>
                <option value="2">优先 2 箱</option>
                <option value="3">优先 3 箱</option>
                <option value="4">优先 4 箱</option>
                <option value="5">优先 5 箱</option>
                <option value="0">体积最优（自动拆）</option>
              </select></div>
          </div>
          <label class="pk-opt"><input type="checkbox" id="pkStack" checked> 字允许叠放（省运费）</label>
          <button class="btn btn-ghost" id="btnEstimate" style="width:100%;margin-bottom:8px;font-size:12.5px;padding:7px">⚡ 立即重新估算</button>
          <div class="pack-grid">            <div class="field"><label>箱数</label><div class="unit-tag" data-u="箱"><input class="ctl" type="number" id="pk-boxes" min="0" step="1" value="1"></div></div>
            <div class="field"><label>长</label><div class="unit-tag" data-u="cm"><input class="ctl" type="number" id="pk-l" min="0" step="1" value="0"></div></div>
            <div class="field"><label>宽</label><div class="unit-tag" data-u="cm"><input class="ctl" type="number" id="pk-w" min="0" step="1" value="0"></div></div>
            <div class="field"><label>高</label><div class="unit-tag" data-u="cm"><input class="ctl" type="number" id="pk-h" min="0" step="1" value="0"></div></div>
            <div class="field"><label>总重</label><div class="unit-tag" data-u="kg"><input class="ctl" type="number" id="pk-gw" min="0" step="0.1" value="0"></div></div>
          </div>
          <div class="pack-result" id="pkResult"></div>
          <button class="btn btn-ghost btn-block" id="btnFreight" style="font-size:12.5px;padding:7px;margin-bottom:8px">📋 复制发货信息给货代</button>

          
        </div>
      </div>

      <div class="q-actions">
        <button class="btn btn-primary" id="btnText">生成报价文本</button>
        <button class="btn btn-save" id="btnSave">💾 保存</button>
        <button class="btn btn-ghost" id="btnImage">导出图片</button>
        <button class="btn btn-ghost" id="btnExcel">导出 Excel</button>
        <button class="btn btn-ghost" id="btnPrint">打印 / PDF</button>
        <button class="btn btn-ghost" id="btnGotoFreight" title="把包装尺寸/毛重带入主程序的运费计算器">🚚 带入运费计算</button>
        <button class="btn btn-ghost" id="btnGotoSheet" title="打开主程序的汇总报价单（产品价 + 运费）">🧾 汇总报价单</button>
        <button class="btn btn-ghost" id="btnClear">清空</button>
      </div>
    </div>
  </section>
</div>
</div>

<!-- 客户管理视图 -->
<div class="view" id="viewCustomers">
  <div class="cust-view">
    <div class="cust-view-head">
      <div class="cvh-title">
        <h2>客户管理</h2>
        <span class="cust-view-count" id="custViewCount"></span>
      </div>
      <div class="cust-view-actions">
        <input class="ctl" id="custViewSearch" placeholder="搜客户名 / 国家 / 渠道 / 产品">

      </div>
    </div>

    <div class="cust-stats" id="custStats">
      <div class="cs-item"><span class="cs-label">客户总数</span><span class="cs-val" id="csCustomers">0</span></div>
      <div class="cs-item"><span class="cs-label">累计报价单</span><span class="cs-val" id="csQuotes">0</span></div>
      <div class="cs-item"><span class="cs-label">累计金额</span><span class="cs-val" id="csAmount">¥0</span></div>
      <div class="cs-item"><span class="cs-label">本周新增</span><span class="cs-val" id="csWeek">0</span></div>
    </div>

    <div class="cust-view-grid" id="custViewList"></div>
  </div>
</div>

<!-- 报价文本弹层 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-h">
      <h3 id="modalTitle">报价文本</h3>
      <button class="btn btn-ghost" style="padding:5px 12px" id="btnClose">关闭</button>
    </div>
    <div class="modal-b">
      <textarea id="output" spellcheck="false"></textarea>
    </div>
    <div class="modal-f">
      <button class="btn btn-ghost" id="btnDownload">下载 .txt</button>
      <button class="btn btn-primary" id="btnCopy">复制全文</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 历史记录弹层 -->
<div class="mask" id="histMask">
  <div class="modal" style="width:min(640px,100%)">
    <div class="modal-h">
      <h3 id="histTitle">报价记录</h3>
      <div class="hist-tabs">
        <button type="button" class="hist-tab active" data-tab="quotes">报价记录</button>
        <button type="button" class="hist-tab" data-tab="customers">客户</button>
      </div>
      <button class="btn btn-ghost" style="padding:5px 12px" id="histClose">关闭</button>
    </div>
    <div class="modal-b" style="padding-top:12px">
      <input class="ctl" id="histSearch" placeholder="搜客户名或产品，留空看全部" style="margin-bottom:12px">
      <input class="ctl" id="custSearch" placeholder="搜客户名 / 国家 / 渠道 / 产品" style="margin-bottom:12px" hidden>
      <div id="histList"></div>
      <div id="custList" hidden></div>
    </div>
    <div class="modal-f" style="flex-wrap:wrap;gap:7px">
      <span id="histCount" style="margin-right:auto;font-size:12px;color:var(--ink3);align-self:center"></span>
      <button class="btn btn-ghost" id="btnAddCust" style="padding:6px 12px;font-size:12px" hidden>+ 新增客户</button>
      <button class="btn btn-ghost" id="btnBackup" style="padding:6px 12px;font-size:12px" title="导出全部数据存成文件">导出备份</button>
      <button class="btn btn-ghost" id="btnRestore" style="padding:6px 12px;font-size:12px" title="从备份文件恢复">恢复备份</button>
      <button class="btn btn-ghost" id="histClear">清空记录</button>
      <input type="file" id="backupFile" accept=".json,application/json" style="display:none">
    </div>
  </div>
</div>

<!-- 打印 / PDF 版（A4，按公司模板排版，屏幕不显示） -->
<div class="print-sheet" id="printSheet"></div>

<script>

      {id:'dia-rgb',   name:'钻石字 · 幻彩',         en:'Diamond letters (RGB)',              mode:'letter', price:8,   range:'幻彩 8 元起', grad:true, note:'', t:9,   kg:12},

function loadRateCache(){

async function fetchRates(){
  const btn = document.getElementById('btnRate');
  if(btn) btn.classList.add('busy');
  try{
    const url = 'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/cny.json';
    const res = await fetch(url, {cache: 'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const cny = j.cny || {};
    const out = {};
    CUR_LIST.forEach(k => {
      const v = cny[k.toLowerCase()];
      if(v > 0) out[k] = 1 / v;
    });
    if(!Object.keys(out).length) throw new Error('返回数据为空');
    state.rates = out;
    state.ratesAt = Date.now();
    try{ localStorage.setItem(RATE_KEY, JSON.stringify({rates: out, at: state.ratesAt})); }catch(e){}
    applyCurrency(state.currency, true);
    toast('汇率已更新（' + (j.date || '今日') + '）');
  }catch(e){
    toast('取汇率失败：' + (e.message || e) + '，可手动填');
  }finally{
    if(btn) btn.classList.remove('busy');
  }
}

/* ========================= 单位换算 ========================= */
/* inputs 里始终存标准单位：发光字存 cm，灯箱类存 m */
const U2CM = {cm: 1, inch: 2.54, ft: 30.48, m: 100};
const ULABEL = {cm: 'cm', inch: 'in', ft: 'ft', m: 'm'};

function unitFactor(u, mode){
  const f = U2CM[u] || 1;
  return mode === 'letter' ? f : f / 100;
}
function fmtN(v){
  const r = Math.round((+v || 0) * 100) / 100;
  return String(r);
}

function selectProduct(id){
  const p = ALL[id];
  if(!p) return;
  const prev = state.current && ALL[state.current.id].mode === p.mode ? state.current : null;
  state.current = {
    id: id,
    price: p.price,
    unit: prev ? prev.unit : (p.mode === 'area' ? 'm' : 'cm'),
    inputs: prev ? Object.assign({}, prev.inputs, {grad: !!p.grad}) : (p.mode === 'letter'
      ? {rows: [{h: 45, count: 5}], sets: 1, grad: !!p.grad}
      : p.mode === 'area'
      ? {w: 1.2, h: 0.8, qty: 1}
      : p.mode === 'path'
      ? {meters: 4, h: 45, count: 1, tier: 9, qty: 1}
      : {qty: 1})
  };
  renderCatalog();
  renderBuilder();
}

/* ========================= 计算核心 ========================= */
function letterNote(base){
  const b = Number(base) || 0;
  return `60cm 以下 ${fmtN(b)} 元/cm　·　60–80cm ${fmtN(b + 0.5)} 元/cm　·　80cm 以上 ${fmtN(b + 1)} 元/cm`;
}

function unitPriceAt(price, hCm, grad, tiers){
  // 分档表优先：tiers = [[上限cm, 单价], ...] 按字高落档
  if(tiers && tiers.length){
    for(const t of tiers){
      if(hCm <= t[0]) return { unit: t[1], tier: `${t[0]}cm 以内档` };
    }
    const last = tiers[tiers.length - 1];
    return { unit: last[1], tier: `${last[0]}cm 以上档` };
  }
  let unit = Number(price) || 0;
  let tier = '';
  if(grad){
    if(hCm > 80){ unit += 1.0; tier = '80cm 以上档'; }
    else if(hCm > 60){ unit += 0.5; tier = '60–80cm 档'; }
  }
  return {unit, tier};
}

/* rows: [{h: 字高(cm), count: 字数}, ...] —— 支持一单里多种字高 */
function calcLetter(price, rows, sets, grad, u, tiers){
  const uu = u || 'cm';
  const f = unitFactor(uu, 'letter');
  const lines = [];
  let total = 0;
  (rows || []).forEach(r => {
    const h = +r.h || 0, w = +r.w || 0, c = +r.count || 0;
    if(h <= 0 || c <= 0) return;
    // 按最大边计价：字宽比字高大就按字宽算
    const bill = Math.max(h, w);
    const up = unitPriceAt(price, bill, grad, tiers);
    const amt = up.unit * bill * c * sets;
    total += amt;
    lines.push({
      h: h,
      w: w,
      bill: bill,
      c: c,
      unit: up.unit,
      tier: up.tier,
      hTxt: (uu === 'cm') ? `${fmtN(bill)}cm` : `${fmtN(bill / f)}in（${bill.toFixed(2)}cm）`,
      sizeTxt: (w > 0 && Math.abs(w - h) > 0.01)
        ? (uu === 'cm' ? `${fmtN(h)}×${fmtN(w)}cm` : `${fmtN(h / f)}×${fmtN(w / f)}${uu === 'inch' ? 'in' : uu === 'ft' ? 'ft' : 'm'}`)
        : '',
      amt: amt
    });
  });
  return {amount: total, lines: lines};
}

function calcArea(price, w, h, qty, u){
  const uu = u || 'm';
  const f = unitFactor(uu, 'area');
  const ul = ULABEL[uu];
  const dimTxt = (uu === 'm')
    ? `${fmtN(w)}m × ${fmtN(h)}m`
    : `${fmtN(w / f)}${ul} × ${fmtN(h / f)}${ul}（${w.toFixed(2)}m × ${h.toFixed(2)}m）`;

  if(w >= 1 && h >= 1){
    const a = w * h;
    return {
      amount: a * price * qty,
      basis: '平方',
      formula: `${dimTxt} = ${a.toFixed(2)}㎡ × ${money(price)} 元/㎡${qty > 1 ? ' × ' + qty + ' 件' : ''}`
    };
  }
  const m = Math.max(w, h);
  return {
    amount: m * price * qty,
    basis: '最大边',
    formula: `${dimTxt} → 单边不足 1m，按最大边 ${m.toFixed(2)}m × ${money(price)} 元/m${qty > 1 ? ' × ' + qty + ' 件' : ''}`
  };
}

/* 霓虹灯：按发光线条总长计价 */
function calcPath(price, meters, qty){
  const m = Math.max(0, +meters || 0);
  const q = Math.max(1, +qty || 1);
  const amount = (Number(price) || 0) * m * q;
  const formula = `${money(price)} 元/m × ${fmtN(m)}m${q > 1 ? ' × ' + q + ' 件' : ''}`;
  return {amount: amount, formula: formula};
}

function calcQty(price, qty){
  return {amount: price * qty, formula: `${money(price)} 元 × ${qty} 件`};
}

function computeCurrent(){
  const c = state.current;
  if(!c) return null;
  const p = ALL[c.id];
  const i = c.inputs;
  if(p.mode === 'letter') return calcLetter(c.price, i.rows, +i.sets || 1, i.grad, c.unit, p.tiers);
  if(p.mode === 'area')   return calcArea(c.price, +i.w || 0, +i.h || 0, +i.qty || 1, c.unit);
  if(p.mode === 'path')   return calcPath(c.price, +i.meters || 0, +i.qty || 1);
  return calcQty(c.price, +i.qty || 1);
}

/* ========================= 灯带 / 电源估算 =========================
   灯带沿字形轮廓内平铺，间隔 d(cm) → 每平米需 100/d 米灯带
   每米 12W；电源按额定功率 × 负载上限 决定台数
   ================================================================ */
const LED_W_PER_M = 12;

function calcPower(){
  const c = state.current;
  if(!c) return null;
  const p = ALL[c.id];
  const i = c.inputs;
  if(p.mode === 'qty') return null;

  const gap = Math.max(1, +state.power.gap || 3);
  const watt = Math.max(10, +state.power.watt || 320);
  const load = Math.min(100, Math.max(40, +state.power.load || 100));

  let area = 0;
  if(p.mode === 'letter'){
    // 字形轮廓填充率：英文数字约 30%，汉字约 40%
    const fill = (c.id === 'rgb-en') ? 0.30 : 0.40;
    (i.rows || []).forEach(r => {
      const h = +r.h || 0, cnt = +r.count || 0;
      if(h > 0 && cnt > 0) area += (h / 100) * (h / 100) * fill * cnt;
    });
  } else {
    area = (+i.w || 0) * (+i.h || 0) * (+i.qty || 1);
  }

  if(area <= 0) return {area: 0, len: 0, power: 0, count: 0, realLoad: 0, watt: watt, gap: gap};

  const len = area * (100 / gap);
  const power = len * LED_W_PER_M;
  const perPsu = watt * load / 100;
  // 减 1e-6 抵消浮点误差，避免 4.0000000001 被进位成 5 台
  const count = Math.max(1, Math.ceil(power / perPsu - 1e-6));
  const realLoad = power / (count * watt) * 100;
  return {area: area, len: len, power: power, count: count, realLoad: realLoad, watt: watt, gap: gap};
}

function renderPower(){
  const box = $('#pwResult');
  if(!box) return;
  const r = calcPower();
  if(!r) return;
  if(r.area <= 0){
    box.innerHTML = `<div class="pw-hint">先填好尺寸，这里会算出灯带长度和电源台数</div>`;
    return;
  }
  box.innerHTML = `
    <div class="pw-row"><span>发光面积</span><b>${r.area.toFixed(2)} ㎡</b></div>
    <div class="pw-row"><span>灯带总长（间隔 ${r.gap}cm）</span><b>${r.len.toFixed(1)} m</b></div>
    <div class="pw-row"><span>总功率</span><b>${Math.round(r.power)} W</b></div>
    <div class="pw-row hi"><span>需要电源</span><b>${r.count} 台</b></div>
    <div class="pw-hint">按 ${r.watt}W/台 计，${r.count} 台合计 ${r.watt * r.count}W，实际负载 ${r.realLoad.toFixed(0)}%</div>
  `;
}

function addPsu(){
  const r = calcPower();
  if(!r || r.count <= 0){ toast('先填好尺寸'); return; }
  const psu = ALL['psu-mw'];
  state.items.push({

}

/* ========================= 导入设计稿（SVG） =========================
   浏览器原生支持 getTotalLength()，SVG 里的矢量路径可以直接量出长度。
   CDR 是封闭格式读不了，所以在 CDR 里导出 SVG 再导入。
   ==================================================================== */
let imported = null;

/* 把 "120mm" / "5cm" / "2in" 换算成 cm；px 没物理意义，返回 0 */
function svgLenToCm(s){
  if(!s) return 0;
  const m = String(s).trim().match(/^([\d.]+)\s*(mm|cm|in|pt|px)?$/i);
  if(!m) return 0;
  const v = parseFloat(m[1]);
  const u = (m[2] || 'px').toLowerCase();
  const k = {mm: 0.1, cm: 1, 'in': 2.54, pt: 0.03528}[u];
  return k ? v * k : 0;
}

async function parseDesignSvg(file){
  let text = '';
  try{ text = await file.text(); }catch(e){ toast('读不了这个文件'); return; }

  const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
  const root = doc.documentElement;
  if(!root || root.nodeName.toLowerCase() !== 'svg'){ toast('不是有效的 SVG 文件'); return; }

  let vbW = 0, vbH = 0;
  const vb = (root.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
  if(vb.length === 4 && vb[2] > 0 && vb[3] > 0){ vbW = vb[2]; vbH = vb[3]; }
  if(!vbW){
    vbW = parseFloat(root.getAttribute('width')) || 0;
    vbH = parseFloat(root.getAttribute('height')) || 0;
  }
  if(!vbW || !vbH){ vbW = 1000; vbH = 1000; }

  const physW = svgLenToCm(root.getAttribute('width'));
  const physH = svgLenToCm(root.getAttribute('height'));

  // 塞进 DOM 才能调 getTotalLength
  const holder = document.createElement('div');
  holder.style.cssText = 'position:absolute;left:-99999px;top:0;width:0;height:0;overflow:hidden';
  const copy = document.importNode(root, true);
  copy.setAttribute('width', vbW);
  copy.setAttribute('height', vbH);
  holder.appendChild(copy);
  document.body.appendChild(holder);

  let raw = 0, count = 0;
  const live = holder.querySelector('svg');
  live.querySelectorAll('path,line,polyline,polygon,circle,ellipse,rect').forEach(el => {
    try{
      const l = el.getTotalLength ? el.getTotalLength() : 0;
      if(l > 0){ raw += l; count++; }
    }catch(e){}
  });
  holder.remove();

  if(!count){ toast('SVG 里没找到可测量的路径'); return; }

  imported = {raw: raw, vbW: vbW, vbH: vbH, count: count, physW: physW};
  renderImportResult();
  toast('已读取 ' + count + ' 个路径');
}

/* PDF 路径长度：遍历绘制指令，直线直接累加，曲线采样近似 */
function pdfPathLen(ops, coords){
  const O = pdfjsLib.OPS;
  let len = 0, ci = 0, px = 0, py = 0, sx = 0, sy = 0;
  const d = (x1, y1, x2, y2) => Math.sqrt((x2-x1)*(x2-x1) + (y2-y1)*(y2-y1));

  for(let k = 0; k < ops.length; k++){
    const op = ops[k];
    if(op === O.moveTo){
      px = coords[ci++]; py = coords[ci++]; sx = px; sy = py;
    } else if(op === O.lineTo){
      const x = coords[ci++], y = coords[ci++];
      len += d(px, py, x, y); px = x; py = y;
    } else if(op === O.curveTo){
      const x1 = coords[ci++], y1 = coords[ci++];
      const x2 = coords[ci++], y2 = coords[ci++];
      const x3 = coords[ci++], y3 = coords[ci++];
      let lx = px, ly = py;
      for(let s = 1; s <= 24; s++){
        const t = s / 24, u = 1 - t;
        const bx = u*u*u*px + 3*u*u*t*x1 + 3*u*t*t*x2 + t*t*t*x3;
        const by = u*u*u*py + 3*u*u*t*y1 + 3*u*t*t*y2 + t*t*t*y3;
        len += d(lx, ly, bx, by); lx = bx; ly = by;
      }
      px = x3; py = y3;
    } else if(op === O.quadraticCurveTo){
      const x1 = coords[ci++], y1 = coords[ci++];
      const x2 = coords[ci++], y2 = coords[ci++];
      let lx = px, ly = py;
      for(let s = 1; s <= 24; s++){
        const t = s / 24, u = 1 - t;
        const bx = u*u*px + 2*u*t*x1 + t*t*x2;
        const by = u*u*py + 2*u*t*y1 + t*t*y2;
        len += d(lx, ly, bx, by); lx = bx; ly = by;
      }
      px = x2; py = y2;
    } else if(op === O.closePath){
      len += d(px, py, sx, sy); px = sx; py = sy;
    }
  }
  return len;
}

async function parseDesignPdf(file){
  if(typeof pdfjsLib === 'undefined'){ toast('PDF 组件没加载，请重新安装程序'); return; }

  let buf = null;
  try{
    buf = await new Promise(function(resolve, reject){
      const fr = new FileReader();
      fr.onload = () => resolve(new Uint8Array(fr.result));
      fr.onerror = () => reject(new Error('读取失败'));
      fr.readAsArrayBuffer(file);
    });
  }catch(e){ toast('读不了这个文件'); return; }

  // file:// 下 Worker 会被同源策略挡住，直接主线程解析
  let pdf = null;
  try{
    pdf = await pdfjsLib.getDocument({data: buf, disableWorker: true}).promise;
  }catch(e){
    toast('PDF 打不开：' + (e && e.message ? e.message : '格式不支持'));
    return;
  }

  let total = 0, count = 0, pageW = 0, pageH = 0;
  try{
    for(let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const vp = page.getViewport({scale: 1});
      if(i === 1){ pageW = vp.width; pageH = vp.height; }
      const ops = await page.getOperatorList();
      for(let j = 0; j < ops.fnArray.length; j++){
        if(ops.fnArray[j] !== pdfjsLib.OPS.constructPath) continue;
        const a = ops.argsArray[j];
        const l = pdfPathLen(a[0], a[1]);
        if(l > 0.5){ total += l; count++; }
      }
    }
  }catch(e){
    toast('解析出错：' + e.message);
    return;
  }

  if(!count){ toast('PDF 里没有矢量路径，可能是图片转的'); return; }

  const CM_PER_PT = 0.03528;   // 1pt = 0.3528mm
  imported = {
    raw: total,
    vbW: pageW,
    vbH: pageH,
    count: count,
    physW: pageW * CM_PER_PT,
    src: 'pdf'
  };
  renderImportResult();
  toast('已读取 PDF ' + pdf.numPages + ' 页，' + count + ' 条路径');
}

function renderImportResult(){
  const box = document.getElementById('importResult');
  if(!box) return;
  if(!imported){ box.hidden = true; return; }
  box.hidden = false;

  const imp = imported;
  const widthCm = +imp.physW || 0;
  const scale = widthCm > 0 ? (widthCm / 100) / imp.vbW : 0;   // 米 / SVG单位
  const meters = scale > 0 ? imp.raw * scale : 0;
  const heightCm = widthCm > 0 ? imp.vbH * (widthCm / imp.vbW) : 0;

  box.innerHTML =
    '<div class="imp-row">读到大 <b>' + imp.count + '</b> 个路径，线条总长 <b>' + Math.round(imp.raw) + '</b>（SVG 单位）</div>' +
    '<div class="imp-row"><span>设计稿实际宽度</span>' +
    '<input class="ctl" type="number" id="imp-w" value="' + (widthCm || '') + '" placeholder="cm" style="width:88px;padding:6px 9px">' +
    '<span>cm</span></div>' +
    (meters > 0
      ? '<div class="imp-row">→ 发光路径约 <b>' + meters.toFixed(2) + ' m</b>' +
        (heightCm ? '，整体高约 <b>' + heightCm.toFixed(1) + ' cm</b>' : '') + '</div>' +
    (imp.src === 'pdf' ? '<div class="imp-row" style="color:#c07a3a;font-size:11px">PDF 曲线为近似计算，建议核对；SVG 更准</div>' : '') +
        '<button class="btn btn-ghost btn-block" id="btnApplyImport" style="margin-top:6px">填入当前产品</button>'
      : '<div class="imp-row" style="color:var(--ink3)">填上设计稿的实际宽度，就能算出米数</div>');

  const wInp = document.getElementById('imp-w');
  if(wInp) wInp.oninput = e => {
    const val = e.target.value;
    imported.physW = +val || 0;
    renderImportResult();
    const w2 = document.getElementById('imp-w');
    if(w2){ w2.value = val; w2.focus(); }
  };

  const ab = document.getElementById('btnApplyImport');
  if(ab) ab.onclick = () => applyImport(meters, heightCm, widthCm);
}

function applyImport(meters, heightCm, widthCm){
  const c = state.current;
  if(!c) return;
  const p = ALL[c.id];

  if(p.mode === 'path'){
    c.inputs.meters = Math.round(meters * 100) / 100;
    renderBuilder();
    toast('已填入发光路径 ' + meters.toFixed(2) + ' m');

  } else if(p.mode === 'letter'){
    if(!heightCm){ toast('先填一下设计稿实际宽度'); return; }
    c.inputs.rows = c.inputs.rows || [{h: 45, count: 1}];
    c.inputs.rows[0].h = Math.round(heightCm * 10) / 10;
    renderBuilder();
    toast('已填入字高 ' + heightCm.toFixed(1) + ' cm');

  } else if(p.mode === 'area'){
    if(!widthCm || !heightCm){ toast('先填一下设计稿实际宽度'); return; }
    c.inputs.w = Math.round(widthCm) / 100;
    c.inputs.h = Math.round(heightCm) / 100;
    renderBuilder();
    toast('已填入尺寸 ' + Math.round(widthCm) + ' × ' + Math.round(heightCm) + ' cm');
  }
}

function bindImport(){
  const btn = document.getElementById('btnImport');
  const inp = document.getElementById('svgFile');
  if(btn && inp){
    btn.onclick = () => inp.click();
    inp.onchange = e => {
      const f = e.target.files && e.target.files[0];
      if(f){
        if(/\.pdf$/i.test(f.name)) parseDesignPdf(f);
        else parseDesignSvg(f);
      }
      e.target.value = '';
    };
  }
  renderImportResult();
}
