      <span class="lbl">单价</span>
      <input type="number" id="f-price" value="${c.price}" step="0.1" min="0">
      <span class="lbl">${p.unitLabel || (p.mode === 'letter' ? '元/cm' : (p.mode === 'area' || p.mode === 'path') ? '元/m' : '元/件')}</span>
    </div>
    <div class="price-note" id="priceNote"></div>

    ${fields}

    <div class="import-row">
      <button class="btn btn-ghost" id="btnImport" style="font-size:12.5px;padding:7px 12px">📐 导入设计稿</button>
      <span class="import-hint">SVG / PDF，CDR 请先导出</span>
    </div>
    <div class="import-result" id="importResult" hidden></div>
    <input type="file" id="svgFile" accept=".svg,.pdf,image/svg+xml,application/pdf" style="display:none">

    <div class="preview" id="preview"></div>

    ${pwBox}

    <button class="btn btn-primary btn-block" id="btnAdd">加入报价单</button>
    <button class="btn btn-ghost btn-block" id="btnSaveTpl" style="margin-top:8px;font-size:12.5px;padding:7px">☆ 存为常用规格</button>
  `;

  bindField('f-price', v => { state.current.price = +v; });
  bindField('f-meters', v => { state.current.inputs.meters = +v || 0; });
  bindField('est-h',    v => { state.current.inputs.h = +v || 0; refreshEst(); });
  bindField('est-count',v => { state.current.inputs.count = +v || 0; refreshEst(); });
  bindField('f-w',    v => { state.current.inputs.w = (+v || 0) * f; });
  bindField('f-h',    v => { state.current.inputs.h = (+v || 0) * f; });
  bindField('f-qty',  v => { state.current.inputs.qty = +v; });
  bindField('f-sets', v => { state.current.inputs.sets = +v; });

  /* 多行尺寸 */
  box.querySelectorAll('.row input').forEach(inp => {
    inp.oninput = e => {
      const idx = +e.target.dataset.i;
      const k = e.target.dataset.k;
      const row = state.current.inputs.rows[idx];
      if(!row) return;
      const v = +e.target.value || 0;
      if(k === 'h') row.h = v * f;
      else if(k === 'w') row.w = v > 0 ? v * f : 0;
      else row.count = v;
      updatePreview();
    };
  });
  box.querySelectorAll('.row-del').forEach(btn => {
    btn.onclick = () => {
      const rows = state.current.inputs.rows;
      if(rows.length <= 1) return;
      rows.splice(+btn.dataset.i, 1);
      renderBuilder();
    };
  });
  const addRowBtn = $('#btnAddRow');
  if(addRowBtn) addRowBtn.onclick = () => {
    const rows = state.current.inputs.rows;
    const last = rows[rows.length - 1] || {h: 45};
    rows.push({h: Math.max(3, Math.round((last.h || 45) / 2)), count: 1});
    renderBuilder();
  };

  box.querySelectorAll('.ub').forEach(b => {
    b.onclick = () => { state.current.unit = b.dataset.u; renderBuilder(); };
  });

  /* 霓虹灯路径估算器 */
  const tierSel = $('#est-tier');
  if(tierSel) tierSel.onchange = e => { state.current.inputs.tier = +e.target.value; refreshEst(); };
  const estBtn = document.getElementById('btnEstPath');
  if(estBtn) estBtn.onclick = () => {
    const inp = state.current.inputs;
    inp.meters = Math.round((inp.h / 100) * (inp.tier || 9) * (inp.count || 1) * 10) / 10;
    renderBuilder();
  };

  const gradEl = $('#f-grad');
  if(gradEl) gradEl.onchange = e => { state.current.inputs.grad = e.target.checked; updatePreview(); };

  /* 灯带 / 电源参数 */
  ['pw-gap', 'pw-watt', 'pw-load'].forEach(pid => {
    const el = $('#' + pid);
    if(!el) return;
    el.oninput = e => {
      const v = +e.target.value || 0;
      if(pid === 'pw-gap') state.power.gap = v;
      else if(pid === 'pw-watt') state.power.watt = v;
      else state.power.load = v;
      renderPower();
      save();
    };
  });
  const ptBtn = $('#powerToggle');
  if(ptBtn) ptBtn.onclick = () => { state.power.open = !state.power.open; renderBuilder(); save(); };
  const psuBtn = $('#btnAddPsu');
  if(psuBtn) psuBtn.onclick = addPsu;

  $('#btnAdd').onclick = addItem;
  var stBtn = document.getElementById('btnSaveTpl');
  if(stBtn) stBtn.onclick = saveTemplate;
  bindImport();
  updatePreview();
}

function bindField(id, fn){
  const el = $('#' + id);
  if(!el) return;
  el.oninput = e => { fn(e.target.value); updatePreview(); };
}

function refreshNote(){
  const c = state.current;
  const el = $('#priceNote');
  if(!c || !el) return;
  const p = ALL[c.id];
  let txt = '';
  if(p.mode === 'letter' && p.tiers && p.tiers.length){
    txt = '分档单价：' + p.tiers.map((t, i) => {
      const lo = i === 0 ? '5' : p.tiers[i - 1][0] + 1;
      return `${lo}–${t[0]}cm ${fmtN(t[1])} 元/cm`;
    }).join('　·　') + (p.note ? '\n' + p.note : '');
  }
  else if(p.mode === 'letter' && c.inputs.grad) txt = letterNote(c.price);
  else if(p.note) txt = p.note;
  el.textContent = txt;
  el.style.display = txt ? 'block' : 'none';
}

function updatePreview(){
  refreshNote();
  const r = computeCurrent();
  if(!r) return;
  const isExport = state.mode === 'export';
  const sym = curSym();
  const shown = isExport ? r.amount / state.rate : r.amount;

  let html = '';
  if(r.lines){
    const sets = +state.current.inputs.sets || 1;
    if(r.lines.length){
      html = r.lines.map(l =>
        `<div class="formula">${money(l.unit)} 元/cm × ${l.hTxt}${l.sizeTxt ? '（取最大边）' : ''} × ${l.c} 字${l.tier ? '（' + l.tier + '）' : ''}${sets > 1 ? ' × ' + sets + ' 套' : ''}</div>`
      ).join('');
    } else {
      html = `<div class="formula" style="color:var(--ink3)">填上字高和字数</div>`;
    }
  } else {
    html = `<div class="formula">${r.formula}</div>`;
  }

  $('#preview').innerHTML = html + `<div class="amt">${sym}${money(shown)}</div>`;
  renderPower();
}

/* ========================= 报价单 ========================= */
function addItem(){
  const c = state.current;
  if(!c) return;
  const p = ALL[c.id];
  const r = computeCurrent();
  if(!r || r.amount <= 0){
    toast('先填好尺寸和数量');
    return;
  }
  const i = c.inputs;
  const uu = c.unit || (p.mode === 'area' ? 'm' : 'cm');
  const uf = unitFactor(uu, p.mode);
  const ul = ULABEL[uu];
  let spec = '';
  let formula = '';

  if(p.mode === 'letter'){
    spec = r.lines.map(l => (l.sizeTxt || l.hTxt) + ` × ${l.c} 字`).join('、')
         + (i.sets > 1 ? `，共 ${i.sets} 套` : '');
    formula = r.lines.map(l => `${money(l.unit)} 元/cm × ${l.hTxt} × ${l.c} 字`).join('；');
  } else if(p.mode === 'area'){
    spec = `${fmtN(i.w / uf)}${ul} × ${fmtN(i.h / uf)}${ul}${i.qty > 1 ? ' × ' + i.qty + ' 件' : ''}`;
    formula = r.formula;
  } else if(p.mode === 'path'){
    spec = `发光路径 ${fmtN(i.meters)}m${i.qty > 1 ? ' × ' + i.qty + ' 件' : ''}`;
    formula = r.formula;
  } else {
    spec = `${i.qty} 件`;
    formula = r.formula;
  }

  state.items.push({
    pid: p.id,
    name: p.name,
    en: p.en,
    spec: spec,
    formula: formula,
    amount: r.amount,
    // 存一份结构化尺寸，供包装估算用
    d: p.mode === 'letter'
      ? {mode: 'letter', rows: JSON.parse(JSON.stringify(i.rows || [])), sets: +i.sets || 1}
      : p.mode === 'area'
      ? {mode: 'area', w: +i.w || 0, h: +i.h || 0, qty: +i.qty || 1}
      : p.mode === 'path'
      ? {mode: 'path', meters: +i.meters || 0, qty: +i.qty || 1, h: +i.h || 45, count: +i.count || 1}
      : {mode: 'qty', qty: +i.qty || 1}
  });
  renderQuote();
  save();
  toast('已加入 · ' + p.name);
}

function removeItem(idx){
  state.items.splice(idx, 1);
  renderQuote();
  save();
}

function renderQuote(){
  const box = $('#quoteList');
  if(!state.items.length){
    box.innerHTML = `<div class="q-empty">还没有项目<br>算好一个就点「加入报价单」</div>`;
  } else {
    const sym = curSym();
    box.innerHTML = state.items.map((it, idx) => {
      const amt = state.mode === 'export' ? it.amount / state.rate : it.amount;
      return `<div class="q-item">
        <div class="qi-main">
          <div class="qi-name">${it.name}</div>
          <div class="qi-detail">${it.spec}</div>
          <div class="qi-detail">${it.formula}</div>
        </div>
        <div class="qi-amt">${sym}${money(amt)}</div>
        <button class="q-del" data-idx="${idx}" title="删除">×</button>
      </div>`;
    }).join('');
    box.querySelectorAll('.q-del').forEach(b => b.onclick = () => removeItem(+b.dataset.idx));
  }
  $('#itemCount').textContent = state.items.length + ' 项';
  renderTotals();
  updateSaveState();
  if(state.pack.auto !== false) applyEstimate(true);   // 报价单一变，包装跟着重算
}

function getFactor(){
  return Math.min(500, Math.max(10, +state.factor || 100));
}
function getPackFee(){
  return Math.max(0, +state.packFee || 0);
}

function renderTotals(){
  const sub = state.items.reduce((s, it) => s + it.amount, 0);
  const fee = getPackFee();
  const base = sub + fee;               // 基准价 = 小计 + 包装费
  const f = getFactor();
  const after = base * f / 100;         // 合计 = 基准价 × 系数
  const isExport = state.mode === 'export';
  const sym = curSym();
  const conv = v => isExport ? v / curRate() : v;

  $('#subtotal').textContent = sym + money(conv(sub));
  $('#total').textContent = sym + money(conv(after));
  $('#feeUnit').textContent = isExport ? 'CNY' : '元';

  // 成本与毛利
  const cost = Math.max(0, +state.cost || 0);
  const profitLine = $('#profitLine');
  if(profitLine){
    if(cost > 0 && after > 0){
      const profit = after - cost;
      const rate = profit / after * 100;
      const color = profit >= 0 ? (rate >= 30 ? '#1f9d55' : '#c07a3a') : '#d93a2b';
      profitLine.style.display = 'block';
      profitLine.innerHTML = '毛利 <b style="color:' + color + '">' +
        sym + money(conv(profit)) + '</b>　毛利率 <b style="color:' + color + '">' +
        rate.toFixed(1) + '%</b>';
    } else {
      profitLine.style.display = 'none';
    }
  }

  const note = $('#totalNote');
  if(f !== 100 && base > 0){
    note.style.display = 'block';
    note.textContent = `基准 ${sym}${money(conv(base))} × ${f}%`;
  } else {
    note.style.display = 'none';
  }

  if(isExport){
    $('#cnyLine').style.display = 'flex';
    $('#cnyTotal').textContent = '¥' + money(after);
  } else {
    $('#cnyLine').style.display = 'none';
  }

  // 双物流报价（Option A / B）
  const optOut = document.getElementById('optOut');
  if(optOut){
    const frA = Math.max(0, +state.freightA || 0);
    const frB = Math.max(0, +state.freightB || 0);
    if(frA > 0 || frB > 0){
      let oh = '';
      if(frA > 0) oh += 'Option A：' + incotermName(state.incoterm, state.frAMode, state.frADays) + '　<b>' + sym + money(conv(after + frA)) + '</b>';
      if(frB > 0) oh += (oh ? '<br>' : '') + 'Option B：' + incotermName(state.incoterm, state.frBMode, state.frBDays) + '　<b>' + sym + money(conv(after + frB)) + '</b>';
      optOut.innerHTML = oh;
      optOut.hidden = false;
    } else {
      optOut.hidden = true;
    }
  }

  // 满 1000 送电源：只限国内，外贸不赠送
  const gift = $('#giftTip');
  const hit = !isExport && after >= 1000 && sub > 0;
  gift.textContent = '🎁 满 1000 元，赠送总电源 1 台';
  gift.classList.toggle('hide', !hit);
  updateSaveState();
}

/* ========================= 报价文本 ========================= */
function buildText(){
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth() + 1, dd = d.getDate();
  const dateCN = `${y} 年 ${m} 月 ${dd} 日`;
  const dateEN = d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
  const sub = state.items.reduce((s, it) => s + it.amount, 0);
  const pk = packSummary();
  const fee = getPackFee();
  const base = sub + fee;
  const f = getFactor();
  const after = base * f / 100;

  if(state.mode === 'domestic'){
    const lines = [];
    lines.push('【合肥苏银广告 · 报价单】');
    if(state.customer) lines.push(`客户：${state.customer}`);
    lines.push(`日期：${dateCN}`);
    lines.push('--------------------------------');
    state.items.forEach((it, k) => {
      lines.push(`${k + 1}. ${it.name}　${it.spec}`);
      lines.push(`   ${it.formula} = ¥${money(it.amount)}`);
    });
    lines.push('--------------------------------');
    lines.push(`小计：¥${money(sub)}`);
    if(fee > 0) lines.push(`包装费：¥${money(fee)}`);
    if(f !== 100) lines.push(`价格系数：${f}%（基准 ¥${money(base)}）`);
    lines.push(`合计：¥${money(after)}`);
    if(after >= 1000) lines.push('（满 1000 元，赠送总电源 1 台）');
    if(pk){
      lines.push('');
      lines.push(`包装：${pk.boxes} 个${pk.kind === 'carton' ? '纸箱' : '木箱'} · ${pk.dims}cm${pk.kind === 'carton' ? '' : '（含叉车脚 ' + PACK_MODEL.fork + 'cm）'} · 共 ${pk.cbm.toFixed(3)} CBM`);
      lines.push(`重量：N.W ${pk.nw.toFixed(1)} kg / G.W ${pk.gw.toFixed(1)} kg · 计费重 ${pk.charge.toFixed(1)} kg（长×宽×高÷${pk.div}）`);
    }
    lines.push('');
    lines.push('备注：');
    lines.push('· 以上价格不含安装、税费及运费');
    lines.push('· 报价有效期 7 天');
    lines.push('· 定金到账后安排生产，工期以确认图稿后起算');
    lines.push('');
    lines.push('合肥苏银广告有限公司');
    lines.push('地址：合肥市瑶海区淮远路 469 号');
    return lines.join('\n');
  }

  // 外贸英文
  const lines = [];
  lines.push('QUOTATION');
  lines.push('Suyin Sign | Hefei Suyin Advertising Co., Ltd.');
  lines.push('--------------------------------');
  if(state.customer) lines.push('To: ' + state.customer);
  lines.push('Date: ' + dateEN);
  lines.push('Currency: USD');
  lines.push('');
  state.items.forEach((it, k) => {
    const md = ALL[it.pid] ? ALL[it.pid].mode : '';
    const specTxt = it.spec
      .replace(/、/g, ', ')
      .replace(/，共 /g, ', ')
      .replace(/，/g, ', ')
      .replace(/ 字/g, ' letters')
      .replace(/ 套/g, ' sets')
      .replace(/ 件/g, ' pcs');
    lines.push(`${k + 1}. ${it.en}`);
    lines.push(`   Spec: ${md === 'letter' ? 'Height ' : ''}${specTxt}`);
    lines.push(`   Price: ${curCode()} ${money(it.amount / curRate())}`);
  });
  lines.push('--------------------------------');
  lines.push(`Subtotal: ${curCode()} ${money(sub / curRate())}`);
  if(fee > 0) lines.push(`Packing fee: ${curCode()} ${money(fee / curRate())}`);
  if(f !== 100) lines.push(`Price factor: ${f}% (base ${curCode()} ${money(base / curRate())})`);
  lines.push(`TOTAL: ${curCode()} ${money(after / curRate())}`);
  if(pk){
    lines.push('');
    lines.push(`Packing: ${pk.boxes} ${pk.kind === 'carton' ? 'carton(s)' : 'wooden crate(s)'}, ${pk.dims}cm${pk.kind === 'carton' ? '' : ' (incl. ' + PACK_MODEL.fork + 'cm forklift base)'}, total ${pk.cbm.toFixed(3)} CBM`);
    lines.push(`Weight: N.W ${pk.nw.toFixed(1)}kg / G.W ${pk.gw.toFixed(1)}kg, chargeable ${pk.charge.toFixed(1)}kg (air, 1:${pk.div})`);
  }
  lines.push('');
  lines.push('Terms:');
  if(hasFreight()){
    if(state.freightA > 0) lines.push('· Option A: ' + incotermName(state.incoterm, state.frAMode, state.frADays) + ' | Product + Freight: ' + curCode() + ' ' + money((after + state.freightA) / curRate()));
    if(state.freightB > 0) lines.push('· Option B: ' + incotermName(state.incoterm, state.frBMode, state.frBDays) + ' | Product + Freight: ' + curCode() + ' ' + money((after + state.freightB) / curRate()));
  } else {
    lines.push('· EXW Hefei. Freight, insurance and installation excluded.');
  }
  lines.push('· Lead time: 7-10 working days after deposit received.');
  lines.push('· Quotation valid for 7 days.');
  lines.push('· Payment: Bank Transfer / Wise / Alipay / PayPal.');
  lines.push('');
  lines.push('Best regards,');
  lines.push('Suyin Sign | Sales Team');
  lines.push('WhatsApp / WeChat: +86 181 5516 3260');
  lines.push('Hefei Suyin Advertising Co., Ltd.');
  return lines.join('\n');
}

/* ========================= 报价单出图 ========================= */
function cutText(s, n){
  s = String(s || '');
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function exportQuoteImage(){
  if(!state.items.length){ toast('报价单还是空的'); return; }

  const isExport = state.mode === 'export';
  const sym = curSym();
  const conv = v => isExport ? v / curRate() : v;

  const sub = state.items.reduce((s, i) => s + i.amount, 0);
  const fee = getPackFee();
  const base = sub + fee;
  const fct = getFactor();
  const total = base * fct / 100;

  const W = 900, PAD = 52, ROW = 74;
  // 高度按实际内容算：表头 + 明细 + 汇总行数 + 页脚
  const sumLines = 1 + (fee > 0 ? 1 : 0) + (fct !== 100 ? 1 : 0) + 1;
  const H = 208 + state.items.length * ROW + (36 + sumLines * 26 + 14) + 96;

  const cv = document.createElement('canvas');
  const DPR = 2;
  cv.width = W * DPR;
  cv.height = H * DPR;
  const ctx = cv.getContext('2d');
  ctx.scale(DPR, DPR);

  const F = '"Microsoft YaHei","PingFang SC",sans-serif';
  const INK = '#141b24', GREY = '#7b8694', LINE = '#e6ebf0', BRAND = '#d93a2b';

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = BRAND;
  ctx.fillRect(0, 0, W, 5);

  /* 抬头 */
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = INK;
  ctx.font = 'bold 28px ' + F;
  ctx.fillText('合肥苏银广告有限公司', PAD, 78);
  ctx.fillStyle = GREY;
  ctx.font = '13px ' + F;
  ctx.fillText('Suyin Sign  ·  LED Letters & Signage', PAD, 102);

  const d = new Date();
  const pad2 = n => String(n).padStart(2, '0');
  ctx.textAlign = 'right';
  ctx.fillStyle = INK;
  ctx.font = 'bold 24px ' + F;
  ctx.fillText(isExport ? 'QUOTATION' : '报 价 单', W - PAD, 76);
  ctx.fillStyle = GREY;
  ctx.font = '13px ' + F;
  ctx.fillText(d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()), W - PAD, 102);

  /* 客户 */
  ctx.textAlign = 'left';
  ctx.fillStyle = GREY;
  ctx.font = '13px ' + F;
  ctx.fillText(isExport ? 'To' : '客户', PAD, 146);
  ctx.fillStyle = INK;
  ctx.font = 'bold 16px ' + F;
  ctx.fillText(cutText(state.customer || '—', 40), PAD + 46, 146);

  /* 表头 */
  ctx.fillStyle = '#f7f9fb';
  ctx.fillRect(PAD, 172, W - PAD * 2, 36);
  ctx.fillStyle = GREY;
  ctx.font = '12px ' + F;
  ctx.fillText(isExport ? 'ITEM / SPEC' : '产品 / 规格', PAD + 14, 195);
  ctx.textAlign = 'right';
  ctx.fillText(isExport ? 'AMOUNT' : '金额', W - PAD - 14, 195);
  ctx.textAlign = 'left';

  /* 明细 */
  state.items.forEach((it, k) => {
    const top = 208 + k * ROW;
    ctx.fillStyle = INK;
    ctx.font = 'bold 15px ' + F;
    ctx.fillText(cutText((k + 1) + '. ' + it.name, 42), PAD + 14, top + 26);
    ctx.fillStyle = GREY;
    ctx.font = '12.5px ' + F;
    ctx.fillText(cutText(it.spec, 52), PAD + 14, top + 48);

    ctx.textAlign = 'right';
    ctx.fillStyle = INK;
    ctx.font = 'bold 15px ' + F;
    ctx.fillText(sym + money(conv(it.amount)), W - PAD - 14, top + 32);
    ctx.textAlign = 'left';

    if(k < state.items.length - 1){
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(PAD + 14, top + ROW - 10);
      ctx.lineTo(W - PAD - 14, top + ROW - 10);
      ctx.stroke();
    }
  });

  /* 汇总 */
  let sy = 208 + state.items.length * ROW + 6;
  ctx.strokeStyle = '#cfd7e0';
  ctx.beginPath();
  ctx.moveTo(PAD, sy);
  ctx.lineTo(W - PAD, sy);
  ctx.stroke();
  sy += 30;

  const line = (label, val, big) => {
    ctx.textAlign = 'left';
    ctx.fillStyle = big ? INK : GREY;
    ctx.font = (big ? 'bold 16px ' : '13px ') + F;
    ctx.fillText(label, W - PAD - 280, sy);
    ctx.textAlign = 'right';
    ctx.fillStyle = big ? BRAND : INK;
    ctx.font = (big ? 'bold 22px ' : 'bold 14px ') + F;
    ctx.fillText(val, W - PAD, sy);
    ctx.textAlign = 'left';
    sy += big ? 40 : 26;
  };

    : '以上价格不含安装、税费及运费　·　报价有效期 7 天', PAD, fy + 20);

  /* 导出 */
  cv.toBlob(b => {

/* ========================= 客户档案 ========================= */
const CUST_KEY = 'suyin_customers_v1';

function customersLoad(){
  try{
    const raw = localStorage.getItem(CUST_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }

function customersWrite(list){
  try{ localStorage.setItem(CUST_KEY, JSON.stringify(list)); }catch(e){}
}

/* 按客户名找档案（大小写不敏感） */
function customerFind(name){
  const n = (name || '').trim().toLowerCase();
  if(!n) return null;
  return customersLoad().find(c => (c.name || '').trim().toLowerCase() === n) || null;
}

/* 保存/更新一个客户档案 */
function customerUpsert(c){
  if(!c || !(c.name || '').trim()) return;
  const list = customersLoad();
  const n = c.name.trim().toLowerCase();
  const orig = (c.origName || '').trim();
  const renamed = !!(orig && orig.toLowerCase() !== n);
  // 改名：按旧名字定位原档案原地改名；否则按名字找已有档案合并
  let idx = renamed
    ? list.findIndex(x => (x.name || '').trim().toLowerCase() === orig.toLowerCase())
    : -1;
  if(idx < 0) idx = list.findIndex(x => (x.name || '').trim().toLowerCase() === n);
  if(idx >= 0){
    const merged = Object.assign({}, list[idx], c);
    delete merged.origName;
    list[idx] = merged;
    if(renamed){
      // 历史记录里的客户名同步改，避免档案和记录对不上
      const hl = histLoad().map(r => {
        if((r.customer || '').trim().toLowerCase() === orig.toLowerCase()) r.customer = c.name.trim();
        return r;
      });
      histWrite(hl);
    }
  } else {
    const rec = Object.assign({}, c);
    delete rec.origName;
    list.push(rec);
  }
  customersWrite(list);
}

/* 删除自定义标签：从标签表和所有客户档案里移除 */
function tagDelete(name){
  const n = (name || '').trim();
  if(!n || DEFAULT_TAGS.includes(n)) return false;
  try{
    localStorage.setItem(TAG_KEY, JSON.stringify(tagsLoad().filter(t => t !== n)));
  }catch(e){ return false; }
  try{
    customersWrite(customersLoad().map(c => {
      if(Array.isArray(c.tags) && c.tags.includes(n)) c.tags = c.tags.filter(t => t !== n);
      return c;
    }));
  }catch(e){}
  return true;
}

function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    let d = null;
    try{ d = JSON.parse(fr.result); }catch(e){ toast('文件读不出来，可能不是备份文件'); return; }
    if(!d || d._app !== 'suyin-quote'){ toast('这不是本程序的备份文件'); return; }

    const hc = (d.history || []).length;
    if(!confirm('将覆盖当前的报价记录和常用规格。\n\n备份里有 ' + hc + ' 条报价记录。\n确定恢复吗？')) return;

    try{
      if(d.history) histWrite(d.history);
      if(d.customers) customersWrite(d.customers);
      if(d.quote) localStorage.setItem(STORE_KEY, JSON.stringify(d.quote));
      toast('恢复成功，正在重载…');
      setTimeout(() => location.reload(), 900);
    }catch(e){ toast('恢复失败：' + e.message); }
  };
  fr.onerror = () => toast('读不了这个文件');
  fr.readAsText(file);
}

function histSig(){
  return JSON.stringify({
    c: state.customer || '',
    f: getFactor(),
    fee: getPackFee(),
    m: state.mode,
    it: state.items.map(i => [i.pid, i.spec, Math.round(i.amount * 100)])
  });
}

function histAdd(){
  if(!state.items.length) return 'empty';
  // 存档前从界面同步一次，避免自动填充等情况下 state 与输入框不一致
  state.customer = ($('#customer').value || '').trim();
  state.factor = +$('#factor').value || 100;
  state.packFee = +$('#packFee').value || 0;

  const sig = histSig();
  const list = histLoad();
  // 同一单（quoteId 相同）只更新那一条，不会每加一项就多一条
  let idx = list.findIndex(r => r.qid && r.qid === state.quoteId);
  // 修复：即使 quoteId 相同，只要客户名变了，就视为新的一单，绝不覆盖上一个客户的记录
  if(idx >= 0 && (list[idx].customer || '').trim() !== state.customer){
    idx = -1;
    state.quoteId = newQid();   // 另起一单，之后继续加项也会归到这条新记录
  }
  if(idx >= 0 && list[idx].sig === sig) return 'nochange';

  const sub = state.items.reduce((s, i) => s + i.amount, 0);
  const fee = getPackFee();
  const f = getFactor();
  const rec = {
    id: Date.now() + Math.floor(Math.random() * 1000),
    qid: state.quoteId,
    time: new Date().toISOString(),
    status: (list[idx] && list[idx].status) || 'pending',   // 保留已有状态
    sig: sig,
    customer: state.customer || '',
    mode: state.mode,
    rate: curRate(),
    currency: curCode(),
    factor: f,
    packFee: fee,
    total: (sub + fee) * f / 100,
    items: JSON.parse(JSON.stringify(state.items))
  };
  const isNew = idx < 0;
  if(idx >= 0) list[idx] = rec;
  else list.unshift(rec);
  histWrite(list);
  lastCommittedCustomer = state.customer;   // 记住这次存进去的客户名
  savedSig = sig;                            // 记录已保存的签名
  updateSaveState();

  // 自动建档：报过价的客户名，若还没有档案，就补一条空档案（渠道/国家/产品留空，之后可在客户页补）
  if(state.customer && !customerFind(state.customer)){
    customerUpsert({ name: state.customer, channel: '', country: '', product: '' });
  }

  return isNew ? 'new' : 'update';
}

function histFmtTime(iso){
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderHistory(){
  const kw = ($('#histSearch').value || '').trim().toLowerCase();
  const all = histLoad();
  const list = !kw ? all : all.filter(r =>
    (r.customer || '').toLowerCase().includes(kw) ||
    (r.items || []).some(i => (i.name || '').toLowerCase().includes(kw))
  );
  $('#histCount').textContent = `共 ${all.length} 条` + (kw ? `，匹配 ${list.length} 条` : '');

  const box = $('#histList');
  if(!list.length){
    box.innerHTML = `<div class="hist-empty">${all.length ? '没有匹配的记录' : '还没有记录<br>生成过一次报价文本后就会自动存一份'}</div>`;
    return;
  }

  box.innerHTML = list.map(r => {
    const isExp = r.mode === 'export';
    const rate = r.rate || 7.15;
    const amt = isExp ? ((r.currency || 'USD') + ' ' + money(r.total / (rate || 7.15))) : ('¥' + money(r.total));
    const names = (r.items || []).map(i => i.name).join('、');
    const st = r.status || 'pending';
    const days = Math.floor((Date.now() - new Date(r.time).getTime()) / 86400000);
    const stale = st === 'pending' && days >= 3;
    const stLabel = st === 'won' ? '已成交' : st === 'lost' ? '已流失' : (stale ? '待跟进 · ' + days + '天' : '待跟进');
    const stCls = st === 'won' ? 'st-won' : st === 'lost' ? 'st-lost' : (stale ? 'st-stale' : 'st-pending');
    return `<div class="hist-item">
      <div class="hist-main">
        <div class="hist-date">${histFmtTime(r.time)}${isExp ? ' · 外贸' : ''}</div>
        <div class="hist-cust">${r.customer || '（未填客户）'} <button class="st-badge ${stCls}" data-st="${r.id}" title="点击切换状态">${stLabel}</button></div>
        <div class="hist-meta">${(r.items || []).length} 项 · ${names}</div>
      </div>
      <div class="hist-amt">${amt}</div>
      <button class="btn btn-ghost" style="padding:6px 11px;font-size:12px" data-load="${r.id}">继续报价</button>
      <button class="q-del" data-del="${r.id}" title="删除">×</button>
    </div>`;
  }).join('');

  box.querySelectorAll('[data-st]').forEach(b => {
    b.onclick = () => {
      const id = +b.dataset.st;
      const list = histLoad();
      const rec = list.find(x => x.id === id);
      if(!rec) return;
      const order = ['pending', 'won', 'lost'];
      const cur = rec.status || 'pending';
      rec.status = order[(order.indexOf(cur) + 1) % 3];
      histWrite(list);
      renderHistory();
    };
  });

  box.querySelectorAll('[data-load]').forEach(b => {
    b.onclick = () => histRestore(+b.dataset.load);
  });
  box.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      histWrite(histLoad().filter(x => x.id !== +b.dataset.del));
      renderHistory();
      toast('已删除这条记录');
    };
  });
}

/* ========================= 客户管理 ========================= */
const CHANNELS = ['WA', 'SSM', '邮箱'];
const PRODUCTS = ['幻彩字', '钻石字', '深渊字', '星空字', '灯箱', '千层镜', '霓虹灯', '铝无边字', '金属包边字', '不锈钢背发光', '不锈钢平面字', '超级发光字', '迷你字', '其他'];

/* ===== 客户标签 ===== */
const TAG_KEY = 'suyin_tags_v1';
const DEFAULT_TAGS = [
  '重点客户', '长期合作', '同行转包', '终端客户', '外贸客户',
  '价格敏感', '待跟进', '已成交', '潜在客户'
];

function tagsLoad(){
  try{
    const raw = localStorage.getItem(TAG_KEY);
    const custom = raw ? JSON.parse(raw) : [];
    // 预置 + 自定义，去重
    return [...new Set([...DEFAULT_TAGS, ...(Array.isArray(custom) ? custom : [])])];
  }catch(e){ return DEFAULT_TAGS.slice(); }
}

function tagAdd(name){
  const n = (name || '').trim();
  if(!n) return false;
  if(DEFAULT_TAGS.includes(n)) return false;
  try{
    const raw = localStorage.getItem(TAG_KEY);
    const custom = raw ? JSON.parse(raw) : [];
    if(!custom.includes(n)){ custom.push(n); localStorage.setItem(TAG_KEY, JSON.stringify(custom)); }
  }catch(e){}
  return true;
}

/* 标签配色：按标签在列表里的位置分配，保证相邻标签颜色互不相同；同一标签始终同色 */
const TAG_HUES = [5, 35, 65, 95, 125, 155, 185, 215, 245, 275, 305, 335];
function tagHue(t){
  let idx = -1;
  try{ idx = tagsLoad().indexOf(t); }catch(e){ idx = -1; }
  if(idx >= 0) return TAG_HUES[idx % TAG_HUES.length];
  // 列表里没有（如已删除的旧标签）：退回哈希，保证稳定
  let h = 0;
  for(let i = 0; i < String(t).length; i++) h = (h * 131 + String(t).charCodeAt(i)) >>> 0;
  return TAG_HUES[h % TAG_HUES.length];
}

function customerSummary(c){
  const n = (c.name || '').trim();
  const recs = histLoad().filter(r => (r.customer || '').trim().toLowerCase() === n.toLowerCase());
  let total = 0, last = 0;
  recs.forEach(r => { total += (r.total || 0); const t = new Date(r.time).getTime(); if(t > last) last = t; });
  return { count: recs.length, total: total, last: last };
}

function renderCustomers(){
  const kw = ($('#custSearch').value || '').trim().toLowerCase();
  const list = customersLoad();
  const filtered = !kw ? list : list.filter(c =>
    (c.name || '').toLowerCase().includes(kw) ||
    (c.country || '').toLowerCase().includes(kw) ||
    (c.product || '').toLowerCase().includes(kw) ||

  );

  if(!filtered.length){
    box.innerHTML = `<div class="hist-empty">${list.length ? '没有匹配的客户' : '还没有客户档案<br>报价时填了客户名，点保存就会自动建档'}</div>`;
    return;
  }

  box.innerHTML = filtered.map(c => {
    const s = customerSummary(c);
    const lastTxt = s.last ? histFmtTime(new Date(s.last).toISOString()) : '—';
    const ch = c.channel || '';
    const co = c.country || '';
    const pd = c.product || '';
    const tg = Array.isArray(c.tags) ? c.tags : [];
    return `<div class="cust-card">
      <div class="cust-card-top">
        <span class="cust-name">${(c.name || '')}</span>
        <span class="cust-tags">
          ${ch ? `<span class="cust-tag ch">${ch}</span>` : ''}
          ${co ? `<span class="cust-tag co">${co}</span>` : ''}
          ${pd ? `<span class="cust-tag pd">${pd}</span>` : ''}
        </span>
        <span class="cust-sum">${s.count} 单 · ¥${money(s.total)}</span>
      </div>
      ${tg.length ? `<div class="cust-card-tags">${tg.map(t =>
        `<span class="tag-chip on sm" style="--tag-h:${tagHue(t)}">${t}</span>`
      ).join('')}</div>` : ''}
      <div class="cust-card-bottom">
        <span class="cust-last">最近 ${lastTxt}</span>
        <span class="cust-actions">
          <button class="btn btn-ghost" data-cust-edit="${(c.name||'').replace(/"/g,'&quot;')}" style="padding:3px 10px;font-size:11px">编辑</button>
          <button class="q-del" data-cust-del="${(c.name||'').replace(/"/g,'&quot;')}" title="删除">×</button>

  box.querySelectorAll('[data-cust-edit]').forEach(b => {

  box.querySelectorAll('[data-cust-del]').forEach(b => {
    b.onclick = () => {

      const n = b.dataset.custDel.toLowerCase();
      customersWrite(customersLoad().filter(c => (c.name||'').trim().toLowerCase() !== n));
      renderCustomers();
      toast('已删除客户档案');
    };
  });
}

/* 客户编辑小弹层 */
function openCustomerEditor(name){

  const pdOpts = PRODUCTS.map(p => `<option value="${p}" ${existing.product === p ? 'selected' : ''}>${p}</option>`).join('');
  const selected = new Set(Array.isArray(existing.tags) ? existing.tags : []);

  const ov = document.createElement('div');
  ov.className = 'mask on';
  ov.id = 'custEditMask';
  ov.innerHTML = `<div class="modal" style="width:min(460px,100%)">
    <div class="modal-h"><h3>客户档案</h3><button class="btn btn-ghost" id="custEditClose" style="padding:5px 12px">关闭</button></div>

          <select class="ctl" id="ceChannel"><option value="">—</option>${chOpts}</select></div>
        <div class="field"><label>国家</label>
          <input class="ctl" id="ceCountry" value="${(existing.country||'').replace(/"/g,'&quot;')}" placeholder="如 波兰 / 印度"></div>
      </div>
      <div class="field" style="margin-top:12px"><label>产品</label>
        <select class="ctl" id="ceProduct"><option value="">—</option>${pdOpts}</select></div>

      <div class="field" style="margin-top:14px">
        <label>标签 <span style="color:var(--ink3);font-weight:400;font-size:11px">（可多选，点一下选中/取消）</span></label>
        <div class="tag-picker" id="ceTags"></div>
        <div class="tag-add-row">
          <input class="ctl" id="ceTagInput" placeholder="自定义标签，按回车添加">
          <button class="btn btn-ghost" id="ceTagAdd" type="button" style="padding:7px 12px;font-size:12.5px;white-space:nowrap">添加</button>
        </div>
      </div>
    </div>
    <div class="modal-f">
      <button class="btn btn-primary" id="ceSave">保存</button>
    </div>
  </div>`;
  document.body.appendChild(ov);

  /* 渲染标签选择器 */
  const renderTagPicker = () => {
    const box = $('#ceTags');
    if(!box) return;
    box.innerHTML = tagsLoad().map(t => {
      const on = selected.has(t);
      const custom = !DEFAULT_TAGS.includes(t);
      const q = String(t).replace(/"/g,'&quot;');
      return `<span class="tag-chip-wrap">
        <button type="button" class="tag-chip${on ? ' on' : ''}" data-tag="${q}"
        style="--tag-h:${tagHue(t)}">${t}</button>${
        custom ? `<button type="button" class="tag-del" data-deltag="${q}" title="删除此自定义标签（将从所有客户档案移除）">×</button>` : ''}
      </span>`;
    }).join('');
    box.querySelectorAll('.tag-chip').forEach(b => {
      b.onclick = () => {
        const t = b.dataset.tag;
        if(selected.has(t)) selected.delete(t); else selected.add(t);
        renderTagPicker();
      };
    });
    box.querySelectorAll('.tag-del').forEach(b => {
      b.onclick = () => {
        const t = b.dataset.deltag;
        if(!confirm('删除自定义标签「' + t + '」？\n将从所有客户档案中移除该标签。')) return;
        tagDelete(t);
        selected.delete(t);
        renderTagPicker();
        try{ renderCustomers(); renderCustomerView(); }catch(e){}
        toast('已删除标签「' + t + '」');
      };
    });
  };
  renderTagPicker();

  /* 添加自定义标签 */
  const doAddTag = () => {
    const inp = $('#ceTagInput');
    if(!inp) return;
    const v = inp.value.trim();
    if(!v) return;
    tagAdd(v);
    selected.add(v);
    inp.value = '';
    renderTagPicker();
  };
  const tagBtn = $('#ceTagAdd');
  if(tagBtn) tagBtn.onclick = doAddTag;
  const tagInp = $('#ceTagInput');
  if(tagInp) tagInp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); doAddTag(); } };

  $('#custEditClose').onclick = () => ov.remove();
  ov.onclick = e => { if(e.target === ov) ov.remove(); };
  $('#ceSave').onclick = () => {
    const name = $('#ceName').value.trim();

    customerUpsert({
      name: name,
      origName: origName,
      channel: $('#ceChannel').value,
      country: $('#ceCountry').value.trim(),
      product: $('#ceProduct').value,

    toast('客户档案已保存');

/* 从客户管理一键跳到报价：填入客户名并切回计算界面 */
function startQuoteFor(name){
  switchView('quote');
  const input = $('#customer');
  if(input){ input.value = name; input.dispatchEvent(new Event('input')); }
  // 滚动到报价单区域并聚焦客户名
  setTimeout(() => { if(input) input.focus(); }, 60);
  toast('已填入客户「' + name + '」，开始报价吧');
}

/* 模块切换 */
function switchView(view){
  const q = $('#viewQuote');
  const c = $('#viewCustomers');
  const mg = $('#modeGroup');
  const rw = $('#rateWrap');
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if(view === 'quote'){
    if(q) q.hidden = false;
    if(c) c.hidden = true;
    if(mg) mg.style.display = '';
    if(rw){ rw.style.display = ''; rw.classList.toggle('hide', state.mode !== 'export'); }
  } else {
    if(q) q.hidden = true;
    if(c) c.hidden = false;
    if(mg) mg.style.display = 'none';
    if(rw) rw.style.display = 'none';
    $('#custViewSearch').value = '';
    renderCustomerView();
  }
}

function histRestore(id){
  const rec = histLoad().find(x => x.id === id);
  if(!rec) return;
  state.items = JSON.parse(JSON.stringify(rec.items || []));
  state.customer = rec.customer || '';
  lastCommittedCustomer = state.customer;   // 载入后把该客户标记为「已存过」，改名会另起新单
  savedSig = '';                            // 载入后视为「未保存」的新编辑单
  // 兼容旧记录：以前存的是 discount（折扣%），换算成 factor（系数%）
  state.factor = (rec.factor != null) ? rec.factor : (100 - (rec.discount || 0));
  state.packFee = rec.packFee || 0;
  state.mode = rec.mode || 'domestic';
  state.quoteId = newQid();   // 载入后算新单，改动不会覆盖原记录
  if(rec.rate) state.rate = rec.rate;
  if(rec.currency) state.currency = rec.currency;
  if(rec.frAMode) state.frAMode = rec.frAMode;
  if(rec.frBMode) state.frBMode = rec.frBMode;
  if(rec.incoterm) state.incoterm = rec.incoterm;

  $('#customer').value = state.customer;
  $('#factor').value = state.factor;
  $('#packFee').value = state.packFee;
  $('#costInput').value = state.cost || 0;
  $('#frA').value = state.freightA || 0;
  $('#frB').value = state.freightB || 0;
  $('#frAMode').value = state.frAMode || 'sea';
  $('#frBMode').value = state.frBMode || 'air';
  $('#frADays').value = state.frADays || '';
  $('#frBDays').value = state.frBDays || '';
  $('#incotermSel').value = state.incoterm || 'DDP';
  $('#rateInput').value = state.rate;
  loadRateCache();
  { const cs = document.getElementById('curSel'); if(cs) cs.value = state.currency || 'USD'; }
  document.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));
  $('#rateWrap').classList.toggle('hide', state.mode !== 'export');

  renderQuote();
  save();
  $('#histMask').classList.remove('on');
  toast('已载入，可直接改价再生成');
}

/* ===================== 包装估算（宁多勿少）=====================
   输入：报价单里每个产品的 字高×字数 / 宽×高×数量
   原则：尺寸、重量、体积重全部往大估，宁可多报不可少报
     · 英文数字字宽按字高 ×0.8（W、M 这类宽字也装得下），汉字 ×1.0
     · 厚度 ×1.15、净重 ×1.10；厚度/密度取「产品目录」和「包装规格表」里较大的那个
     · 默认木箱：内衬 4cm + 木板厚 + 叉车脚 10cm；重量含木板、枕木脚、泡沫
     · 叠放：件与件留 2cm 间隙，层与层加 0.5cm 隔垫，超高或超重自动分箱
     · 灯带电源按尺寸估算台数，和报价单里已加的取较大值
   所有常量都在下面，拿到实际装箱数据后可以直接改
   ============================================================ */
const PKG = {
  spec: {
    flat:       {t: 5.0,  kg: 8.0},
    diamond:    {t: 10.0, kg: 13.0}, // 钻石字最重（用户实测确认）
    iridescent: {t: 6.0,  kg: 11.0}, // 幻彩字次重
    starlight:  {t: 6.0,  kg: 7.0},  // 星空字次轻（从 iridescent 拆出）
    abyss:      {t: 4.0,  kg: 5.0},  // 深渊字最轻（28→5，用户实测确认）
    mirror:     {t: 12.0, kg: 25.0},
    lightbox:   {t: 10.0, kg: 10.0},
    neon:       {t: 3.0,  kg: 7.4},
    board:      {t: 0.1,  kg: 3.6}   // 背板基准取最小，实际按产品自带 t/kg（Math.max 取大）
  },
  gap: 2.0,            // 同层相邻件间隔 cm
  fit: 1.00,           // 排样外接尺寸放大系数（1.03→1.00，箱体长宽整体缩小约3%）
  layerFoam: 0.5,      // 叠放时层与层之间的隔垫 cm（可按实测调整）
  packThicknessExtra: 0.5, // 每件产品厚度额外预留 cm（1.0→0.5，箱高略微降低）
  powerDim: [25, 12, 5], powerWt: 1.5,   // 电源 / 控制器：长×宽×厚 cm，单台重 kg
  fillRate: 0.85,      // 一层实际填充率（实心板材/灯箱用，异形字见 letterFillRate）
  letterFillRate: 2.0, // 发光字异形嵌合等效填充率：笔画只占外接矩形约一半，可穿插摆放
  maxAspect: 2.5,
  maxH: 40,            // 单箱高度上限 cm，超了就分箱
  maxSideL: 360,       // 单箱最长边上限 cm（3.6m，千层镜最大规格）
  maxSideW: 240,       // 单箱次长边上限 cm（2.4m）
  maxGross: {crate: 150, carton: 30},    // 单箱毛重上限 kg，超过就分箱
  packBase: 0.6, packPerM2: 1.6,         // 纸箱自重 = 0.6 + 1.6 × 表面积㎡
  foamBase: 0.5, foamPerM2: 0.5          // 内衬泡沫 / 缠绕膜
};

const SAFE = {
  enRatio: 0.80,   // 英文数字：字宽 ÷ 字高
  cnRatio: 1.0,    // 汉字
  thick: 1.01,     // 厚度冗余（贴近实际，几乎不再放大）
  netPct: 1.01     // 净重冗余（贴近实际，几乎不再放大）
};

const PACK_MODEL = {
  pad: 4,           // 木箱内衬：每边留空 cm
  fork: 10,         // 叉车脚高度 cm（不计入箱体本身高度，计入最终外尺寸）
  maxStack: 85,     // 单箱内货物最大堆叠高度 cm
  boardHeavy: 9.5,  // 18mm 木板 kg/㎡（重货）
  boardLight: 5.3,  // 10mm 木板 kg/㎡（轻货）
  thkHeavy: 1.8,    // 18mm
  thkLight: 1.0,    // 10mm
  heavyKg: 60,      // 货物净重超过此值才改用 18mm 厚板
  frameK: 1.05,     // 木框 / 加强条折算系数（按实物薄胶合板箱调低）
  skidKgPerM: 7.5   // 叉车脚枕木：每米箱长约 7.5kg（3 根）
};
const PKG_CARTON = {pad: 3, wall: 0.8};

const PKG_TYPE = {
  'rgb-en': 'iridescent', 'rgb-cn': 'iridescent', 'rgb-static': 'iridescent',
  'star': 'starlight',
  'dia-mono': 'diamond', 'dia-rgb': 'diamond',
  'aby-mono': 'abyss', 'aby-rgb': 'abyss',
  'alu': 'flat', 'metal': 'flat', 'steel': 'flat', 'super': 'flat', 'mini': 'flat',
  'steel-flat-en': 'flat', 'steel-flat-cn': 'flat',
  'mirror': 'mirror', 'cabinet': 'mirror',
  'lb-eco': 'lightbox', 'lb-std': 'lightbox', 'lb-pro': 'lightbox',
  'neon-in': 'neon', 'neon-out': 'neon', 'neon-full': 'neon',
  'bd-pvc': 'board', 'bd-acp': 'board', 'bd-gi': 'board', 'bd-acr': 'board'
};

const pkgR2 = v => Math.round(v * 100) / 100;

/* 厚度 / 密度：以包装规格表 PKG.spec 为准（产品目录 kg 不再参与取大，避免失控） */
function pkgSpecFor(pid){
  const ty = PKG_TYPE[pid] || 'iridescent';
  const sp = PKG.spec[ty];
  return {
    type: ty,
    t: sp.t,
    kg: sp.kg
  };
}

/* 把「货物外形」包成箱子：算外箱尺寸、毛重、体积重、计费重 */
function pkgWrap(cL, cW, cH, netRaw, count, kind, div){
  const net = netRaw * SAFE.netPct;
  let pad, wall, fork = 0, boardKg = 0;
  if(kind === 'crate'){
    const heavy = net > PACK_MODEL.heavyKg;
    pad = PACK_MODEL.pad;
    wall = heavy ? PACK_MODEL.thkHeavy : PACK_MODEL.thkLight;
    boardKg = heavy ? PACK_MODEL.boardHeavy : PACK_MODEL.boardLight;
    fork = PACK_MODEL.fork;
  } else {
    pad = PKG_CARTON.pad;
    wall = PKG_CARTON.wall;
  }
  const L = Math.ceil(cL + 2 * pad + 2 * wall);
  const W = Math.ceil(cW + 2 * pad + 2 * wall);
  const Hb = Math.ceil(cH + 2 * pad + 2 * wall);
  const H = Hb + fork;

  const surf = 2 * (L * W + L * Hb + W * Hb) / 10000;
  const foam = PKG.foamBase + PKG.foamPerM2 * surf;
  const pack = kind === 'crate'
    ? surf * boardKg * PACK_MODEL.frameK + PACK_MODEL.skidKgPerM * Math.max(L, W) / 100 + foam
    : PKG.packBase + PKG.packPerM2 * surf + foam;

  const gross = net + pack;
  const volWt = L * W * H / div;
  return {
    l: L, w: W, h: H, count: count,
    net: pkgR2(net), pack: pkgR2(pack), gross: pkgR2(gross),
    cbm: L * W * H / 1e6,
    volWt: volWt,
    charge: Math.ceil(Math.max(gross, volWt) * 2) / 2,
    driver: volWt > gross ? '体积重' : '实重',
    over: (Math.max(L, W) > PKG.maxSideL) || (Math.min(L, W) > PKG.maxSideW)
  };
}

/* ---------- 平铺：Next-Fit Decreasing Height 行排样 ---------- */
function pkgNFDH(rects, binW){
  const rows = [];
  const sorted = rects.slice().sort((a, b) => b[1] - a[1]);
  for(const rc of sorted){
    const w = rc[0], h = rc[1];
    if(w > binW + 1e-9) return null;
    let placed = false;
    for(const r of rows){
      if(r[0] >= h && r[1] + PKG.gap + w <= binW + 1e-9){
        r[1] += PKG.gap + w;
        placed = true;
        break;
      }
    }
    if(!placed) rows.push([h, w]);
  }
  let totalH = 0;
  rows.forEach((r, i) => { totalH += r[0] + (i ? PKG.gap : 0); });
  return [binW, totalH];
}

function pkgBestLayout(rects, rotate, maxAspect){
  if(!rects.length) return [0, 0];
  rotate = rotate !== false;
  maxAspect = maxAspect || PKG.maxAspect;
  const rs = rotate ? rects.map(r => [Math.max(r[0], r[1]), Math.min(r[0], r[1])]) : rects.slice();

  let lo = 0, hi = 0;
  rs.forEach(r => { lo = Math.max(lo, r[0]); hi += r[0]; });
  hi += PKG.gap * (rs.length - 1);
  const step = Math.max(1, (hi - lo) / 150);   // 最多试 150 个箱宽，步长取整只会往大估

  let best = null;
  for(let bw = lo; bw <= hi + 1e-9; bw += step){
    const r = pkgNFDH(rs, Math.ceil(bw));
    if(!r) continue;
    const w_ = r[0], h_ = r[1];
    const mn = Math.min(w_, h_);
    const aspect = mn > 0 ? Math.max(w_, h_) / mn : 99;
    if(aspect > maxAspect) continue;
    const area = w_ * h_;
    if(!best || area < best.area - 1e-9) best = {area: area, w: w_, h: h_};
  }
  if(!best){
    if(maxAspect >= 99) return [hi, Math.max.apply(null, rs.map(r => r[1]))];
    return pkgBestLayout(rects, false, 99);
  }
  return [best.w, best.h];
}

function pkgOneBox(pieces, kind, div){
  const rects = pieces.map(p => [p.w, p.h]);
  let maxT = 0, net = 0;
  pieces.forEach(p => { maxT = Math.max(maxT, p.t); net += p.kg * p.w * p.h / 10000; });
  const lay = pkgBestLayout(rects);
  return pkgWrap(lay[0] * PKG.fit, lay[1] * PKG.fit, maxT, net, pieces.length, kind, div);
}

function pkgSplit(seq, n){
  const out = [];
  for(let i = 0; i < n; i++) out.push([]);
  seq.forEach((x, i) => out[i % n].push(x));
  return out.filter(c => c.length);
}

/* 平铺总入口：从 1 箱开始试，超重或超长就加箱；单件自己就超限的独立成箱 */
function pkgCalc(pieces, kind, div, fixed){
  if(!pieces.length) return null;
  // 强制箱数：直接平均分，不看重量和尺寸上限
  if(fixed > 0){
    // 从指定箱数开始，装不下就加箱
    for(let f = Math.min(fixed, pieces.length); f <= pieces.length; f++){
      const chunks = pkgSplit(pieces, f);
      const boxes = chunks.map(c => pkgOneBox(c, kind, div));
      const bad = boxes.some(b => b.gross > PKG.maxGross[kind] || b.over || b.h > PKG.maxH);
      if(!bad || f >= pieces.length) return boxes;
    }
  }
  const maxG = PKG.maxGross[kind];

  const lonely = [], rest = [];
  pieces.forEach(p => {
    const b = pkgOneBox([p], kind, div);
    if(b.over || b.gross > maxG) lonely.push(p);
    else rest.push(p);
  });

  const out = [];
  lonely.forEach(p => out.push(pkgOneBox([p], kind, div)));

  if(rest.length){
    rest.sort((a, b) => b.w * b.h - a.w * a.h);
    for(let n = 1; n <= rest.length; n++){
      const chunks = pkgSplit(rest, n);
      const boxes = [];
      let ok = true;
      for(let ci = 0; ci < chunks.length; ci++){
        const b = pkgOneBox(chunks[ci], kind, div);
        if((b.gross > maxG || b.over || b.h > PKG.maxH) && b.count > 1){ ok = false; break; }
        boxes.push(b);
      }
      if(ok){ out.push.apply(out, boxes); return out; }
    }
  }
  return out.length ? out : null;
}

/* ---------- 叠放：同品类一层层往上叠 ---------- */
function pkgStackGroup(pieces, kind, div){
  if(!pieces.length) return [];

  const map = {};
  pieces.forEach(p => {
    const k = [p.w, p.h, p.t, p.kg].map(v => Math.round(v * 10)).join('x');
    if(!map[k]) map[k] = {w: p.w, h: p.h, t: p.t, kg: p.kg, cnt: 0};
    map[k].cnt++;
  });
  const groups = Object.keys(map).map(k => map[k]);
  const total = pieces.length;

  const pad = kind === 'crate' ? PACK_MODEL.pad : PKG_CARTON.pad;
  const wall = kind === 'crate' ? PACK_MODEL.thkLight : PKG_CARTON.wall;
  const cap = (PKG.maxSideL - 2 * (pad + wall) - 2) / PKG.fit;   // 箱底最大长度

  let minW = 0, minH = 0, net = 0;
  groups.forEach(g => {
    minW = Math.max(minW, g.w);
    minH = Math.max(minH, g.h);
    net += g.kg * g.w * g.h / 10000 * g.cnt;
  });

  // 候选箱底：最大件的尺寸，以及「每行/每列正好放 k 个某种件」的宽度（k ≤ 6，不超过箱底上限）
  const cands = (minLen, key) => {
    const set = {};
    set[Math.round(minLen * 10)] = minLen;
    groups.forEach(g => {
      for(let k = 2; k <= 6; k++){
        const v = k * (g[key] + PKG.gap) - PKG.gap;
        if(v > minLen + 1e-9 && v <= cap) set[Math.round(v * 10)] = v;
      }
    });
    return Object.keys(set).map(x => set[x]).sort((a, b) => a - b).slice(0, 10);
  };
  const widths = cands(minW, 'w'), heights = cands(minH, 'h');

  // 每行/每列能放几个（相邻件要留间隙）
  const fitN = (len, w) => Math.max(1, Math.floor((len + PKG.gap) / (w + PKG.gap)));
  const maxG = PKG.maxGross[kind];

  const tryBase = (baseW, baseH) => {
    let stackH = 0, maxLayer = 0, layers = 0;
    groups.forEach(g => {
      const ly = Math.ceil(g.cnt / (fitN(baseW, g.w) * fitN(baseH, g.h)));
      const layerH = g.t + PKG.layerFoam;
      stackH += ly * layerH;
      layers += ly;
      maxLayer = Math.max(maxLayer, layerH);
    });
    stackH -= PKG.layerFoam;   // 最上面一层不需要隔垫

    // 箱数：先按高度，再按毛重；一层不能拆开，所以箱数不会超过层数
    let n = Math.max(1, Math.ceil(stackH / PACK_MODEL.maxStack));
    let proto = null;
    for(;; n++){
      const cH = stackH / n + (n > 1 ? maxLayer : 0);   // 分多箱时多留一层的高度当余量
      proto = pkgWrap(baseW * PKG.fit, baseH * PKG.fit, cH, net / n, 0, kind, div);
      if(proto.gross <= maxG || n >= layers) break;
    }
    const boxes = [];
    for(let i = 0; i < n; i++){
      boxes.push(Object.assign({}, proto, {count: Math.floor(total / n) + (i < total % n ? 1 : 0)}));
    }
    return boxes;
  };

  // 在候选箱底里挑总计费重最小的（相同再挑体积小的）
  let best = null;
  widths.forEach(bw => heights.forEach(bh => {
    const lo = Math.min(bw, bh), hi = Math.max(bw, bh);
    if(hi / lo > 1.6 && !(bw === minW && bh === minH)) return;   // 不要太细长（长宽一起扩）
    const boxes = tryBase(bw, bh);
    const charge = boxes.reduce((s, b) => s + b.charge, 0);
    const cbm = boxes.reduce((s, b) => s + b.cbm, 0);
    if(!best || charge < best.charge - 1e-9 || (Math.abs(charge - best.charge) < 1e-9 && cbm < best.cbm)){
      best = {boxes: boxes, charge: charge, cbm: cbm};
    }
  }));
  return best.boxes;
}

/* 叠放总入口：允许不同字类混合分层；每层按最高产品厚度计，层间加入泡沫 */
function pkgStackCalc(pieces, kind, div, fixed){
  if(!pieces.length) return null;

  // 电源配件仍独立处理，避免压在立体字表面；其余同一订单的字允许混合分层
  const power = pieces.filter(p => p.type === 'power');
  const goods = pieces.filter(p => p.type !== 'power');
  const groups = [];
  const map = {};
  goods.forEach(p => {
    const k = [p.w, p.h].map(v => Math.round(v * 10)).join('x');
    if(!map[k]) map[k] = {w:p.w, h:p.h, pieces:[]};
    map[k].pieces.push(p);
  });
  Object.keys(map).forEach(k => groups.push(map[k]));
  if(!goods.length) return pkgStackGroup(power, kind, div);

  const pad = kind === 'crate' ? PACK_MODEL.pad : PKG_CARTON.pad;
  const wall = kind === 'crate' ? PACK_MODEL.thkLight : PKG_CARTON.wall;
  const cap = (PKG.maxSideL - 2 * (pad + wall) - 2) / PKG.fit;
  const minW = Math.max.apply(null, groups.map(g => g.w));
  const minH = Math.max.apply(null, groups.map(g => g.h));
  const candidates = (baseMin, key) => {
    const set = {}; set[Math.round(baseMin*10)] = baseMin;
    groups.forEach(g => {
      const side = g[key];
      for(let n=2;n<=8;n++){
        const v=n*(side+PKG.gap)-PKG.gap;
        if(v>baseMin && v<=cap) set[Math.round(v*10)] = v;
      }
    });
    const arr = Object.values(set).sort((a,b)=>a-b);
    if(arr.length <= 16) return arr;
    const step = (arr.length - 1) / 15;
    return Array.from({length:16}, (_, i) => arr[Math.round(i*step)]);
  };
  const widths = candidates(minW,'w'), heights = candidates(minH,'h');
  const fitN = (len, side) => Math.max(0, Math.floor((len + PKG.gap)/(side + PKG.gap)));
  const maxG = PKG.maxGross[kind];
  const allGoods = goods.slice().sort((a,b)=>b.t-a.t);
  const netGoods = goods.reduce((s,p)=>s+p.kg*p.w*p.h/10000,0);

  const tryBase = (bw,bh) => {
    // 单件放不下这个箱底就换一个
    for(let i=0;i<allGoods.length;i++){
      const q = allGoods[i];
      const okDirect = (q.w <= bw + 1e-9 && q.h <= bh + 1e-9);
      const okRot    = (q.h <= bw + 1e-9 && q.w <= bh + 1e-9);
      if(!okDirect && !okRot) return null;
    }

    // 按面积降序逐层填充：一层塞满再开下一层（大字先放，小字填空）
    // 发光字用 letterFillRate：异形笔画可穿插嵌合，等效填充率远高于实心矩形
    const capArea = bw * bh * PKG.letterFillRate;
    const sortedByArea = allGoods.slice().sort((a,b) => (b.w*b.h) - (a.w*a.h));
    const layers = [];
    let curLayer = {area: 0, t: 0, count: 0};
    sortedByArea.forEach(q => {
      const a = q.w * q.h;
      if(curLayer.count > 0 && curLayer.area + a > capArea){
        layers.push(curLayer);
        curLayer = {area: 0, t: 0, count: 0};
      }
      curLayer.area += a;
      curLayer.t = Math.max(curLayer.t, q.t);
      curLayer.count++;
    });
    if(curLayer.count > 0) layers.push(curLayer);
    if(!layers.length) return null;

    const stackH=layers.reduce((s,l,i)=>s+l.t+(i<layers.length-1?PKG.layerFoam:0),0);
    const maxLayer=Math.max.apply(null,layers.map(l=>l.t));
    const totalNet=netGoods+power.reduce((s,p)=>s+p.kg*p.w*p.h/10000,0);
    let n = (fixed > 0) ? Math.min(fixed, Math.max(1, goods.length)) : Math.max(1, Math.ceil(stackH/PACK_MODEL.maxStack));
    let proto=null;
    if(fixed > 0){
      // 从指定箱数开始试，装不下（超重/超长宽/超高）就自动加箱
      for(;;n++){
        const cH = stackH / n + (n > 1 ? maxLayer : 0);
        proto = pkgWrap(bw*PKG.fit, bh*PKG.fit, cH, totalNet/n, goods.length+power.length, kind, div);
        proto.stackH = cH;
        if((proto.gross <= maxG && proto.h <= PKG.maxH && !proto.over) || n >= goods.length) break;
      }
    } else {
      for(;;n++){
        const cH=stackH/n+(n>1?maxLayer:0);
        proto=pkgWrap(bw*PKG.fit,bh*PKG.fit,cH,totalNet/n,goods.length+power.length,kind,div);
        // 用实际货物高度判断（含分箱余量），最多拆到每件一箱
        if((proto.gross<=maxG && proto.h<=PKG.maxH) || n>=goods.length) break;
      }
    }
    return Array.from({length:n},(_,i)=>Object.assign({},proto,{count:Math.floor((goods.length+power.length)/n)+(i<(goods.length+power.length)%n?1:0),layerCount:Math.ceil(layers.length/n),layered:true,stackH:stackH/n+(n>1?maxLayer:0)}));
  };

  let best=null;
  widths.forEach(bw=>heights.forEach(bh=>{
    const lo=Math.min(bw,bh), hi=Math.max(bw,bh);
    if(hi/lo>1.6 && !(bw===minW && bh===minH)) return;   // 长宽比 ≤1.6，避免只加一边
    const boxes=tryBase(bw,bh); if(!boxes) return;
    const charge=boxes.reduce((s,b)=>s+b.charge,0);
    const cbm=boxes.reduce((s,b)=>s+b.cbm,0);
    const layers=boxes.reduce((s,b)=>s+(b.layerCount||0),0);
    const maxHt=Math.max.apply(null, boxes.map(b=>b.h));
    const anyOver=boxes.some(b=>b.over);
    // 高度和长宽都得达标，才算合格方案（原来只看高度，会把箱子摊到超宽也认）
    const okH=(maxHt<=PKG.maxH+0.5) && !anyOver;

    const take=()=>{ best={boxes,charge,cbm,layers,okH,heavyBox}; };

    // 木箱自重超过货物 2 倍：箱子太大，不划算（轻货大箱的典型陷阱）
    const netOfBox=boxes.reduce((s,b)=>s+b.net,0);
    const packOfBox=boxes.reduce((s,b)=>s+(b.pack||0),0);
    const heavyBox=(netOfBox>0 && packOfBox>netOfBox*2);

    if(!best){ take(); return; }
    // ① 合格方案（高度+长宽都达标）优先
    if(okH && !best.okH){ take(); return; }
    if(!okH && best.okH) return;
    // ② 同样合格时，木箱不臃肿的优先
    if(!heavyBox && best.heavyBox){ take(); return; }
    if(heavyBox && !best.heavyBox){ return; }
    // ② 同样满足（或同样不满足）时，比计费重
    if(charge < best.charge*0.99){ take(); return; }
    // ③ 计费重近似持平，选层数少的（箱底摊得开，更贴近实际打包）
    if(charge <= best.charge*1.01 && layers < best.layers){ take(); return; }
    // ④ 层数也一样，选体积小的
    if(charge <= best.charge*1.01 && layers === best.layers && cbm < best.cbm) take();
  }));
  if(!best) return pkgStackGroup(pieces,kind,div);
  // 把 heavyBox 标记挂到每个箱子上，供结果区提示使用
  best.boxes.forEach(b => { b.heavyBox = best.heavyBox; });
  return best.boxes;
}

/* 灯带电源台数：和「灯带 / 电源估算」同一套算法，但按套数全量计 */
function pkgPsuEstimate(){
  const pw = state.power || {};
  const gap = Math.max(1, +pw.gap || 3);
  const watt = Math.max(10, +pw.watt || 320);
  const load = Math.min(100, Math.max(40, +pw.load || 100));
  let area = 0;
  state.items.forEach(it => {
    const d = it.d;
    if(!d) return;
    if(d.mode === 'letter'){
      const fill = it.pid === 'rgb-en' ? 0.30 : 0.40;
      (d.rows || []).forEach(r => {
        const h = +r.h || 0, c = (+r.count || 0) * (d.sets || 1);
        if(h > 0 && c > 0) area += (h / 100) * (h / 100) * fill * c;
      });
    } else if(d.mode === 'area'){
      area += (d.w || 0) * (d.h || 0) * (d.qty || 1);
    }
  });
  if(area <= 0) return 0;
  const power = area * (100 / gap) * LED_W_PER_M;
  return Math.max(1, Math.ceil(power / (watt * load / 100) - 1e-6));
}

/* 小字密度更高：边框/底板/LED 在正面投影里占比大，越大越空心 */
function pkgDensityFactor(w, h){
  const a = (w * h) / 10000;      // 单件正面面积 ㎡
  if(a < 0.06) return 1.5;        // 约 25×25cm 以下（3.0→1.5，实测偏大下调）
  if(a < 0.15) return 1.3;        // 约 39×39cm 以下（2.0→1.3）
  if(a < 0.30) return 1.1;        // 约 55×55cm 以下（1.3→1.1）
  return 1.0;                     // 55×55cm 以上
}

/* 从报价单提取待装箱的件 */
function pkgCollect(){
  const pieces = [];
  let accessories = 0, quotedPsu = 0;

  state.items.forEach(it => {
    const d = it.d;
    if(!d) return;
    if(d.mode === 'qty'){
      const q = +d.qty || 1;
      accessories += q;
      if(it.pid === 'psu-mw' || it.pid === 'psu-rgb') quotedPsu += q;
      return;
    }

    const sp = pkgSpecFor(it.pid);
    const t = sp.t + PKG.packThicknessExtra;
    // onlyLetter=true 才按小件提密度（字越小越实心），板材/灯箱密度固定
    const add = (w, h, cnt, onlyLetter) => {
      const kgReal = sp.kg * (onlyLetter ? pkgDensityFactor(w, h) : 1);
      for(let i = 0; i < cnt; i++) pieces.push({w: w, h: h, t: t, kg: kgReal, type: sp.type});
    };

    if(d.mode === 'letter'){
      const ratio = (it.pid === 'rgb-en') ? SAFE.enRatio : SAFE.cnRatio;
      (d.rows || []).forEach(row => {
        const h = +row.h || 0;
        const cnt = (+row.count || 0) * (d.sets || 1);
        if(h <= 0 || cnt <= 0) return;
        // 填了实际字宽就用真的，没填按字高比例估
        const w = (+row.w > 0) ? +row.w : h * ratio;
        add(w, h, cnt);
      });
    } else if(d.mode === 'area'){
      const w = (d.w || 0) * 100, h = (d.h || 0) * 100, q = d.qty || 1;
      if(w > 0 && h > 0) add(w, h, q, false);
    } else if(d.mode === 'path'){
      const hcm = +d.h || 45, cnt = (+d.count || 1) * (d.qty || 1);
      if(hcm > 0) add(hcm, hcm, cnt, false);
    }
  });

  if(!pieces.length) return {pieces: [], powers: 0, estPsu: 0, quotedPsu: quotedPsu, letters: 0};
  const letters = pieces.length;

  // 电源：按尺寸估算的台数 与 报价单里已加的取较大值，再加上控制器等其他配件
  const estPsu = pkgPsuEstimate();
  const powers = accessories + Math.max(0, estPsu - quotedPsu);
  const pw = PKG.powerDim;
  for(let i = 0; i < powers; i++){
    pieces.push({w: pw[0], h: pw[1], t: pw[2] * SAFE.thick, kg: PKG.powerWt * 10000 / (pw[0] * pw[1]), type: 'power'});
  }
  return {pieces: pieces, powers: powers, estPsu: estPsu, quotedPsu: quotedPsu, letters: letters};
}

function estimatePack(){
  const col = pkgCollect();
  if(!col.pieces.length) return null;

  const kind = state.pack.mat === 'carton' ? 'carton' : 'crate';
  const div = Math.max(1000, +state.pack.divisor || 5000);
  let stack = state.pack.stack !== false;
  let fell = false;
  if(!stack && col.pieces.length > 60){ stack = true; fell = true; }   // 件数太多时平铺排样太慢

  const fixed = Math.max(0, +state.pack.fixedBoxes || 0);
  const boxes = stack ? pkgStackCalc(col.pieces, kind, div, fixed) : pkgCalc(col.pieces, kind, div, fixed);
  if(!boxes || !boxes.length) return null;

  let tg = 0, tn = 0, tc = 0, tq = 0;
  boxes.forEach(b => { tg += b.gross; tn += b.net; tc += b.cbm; tq += b.charge; });
  const maxL = Math.max.apply(null, boxes.map(b => b.l));
  const maxW = Math.max.apply(null, boxes.map(b => b.w));
  const maxH = Math.max.apply(null, boxes.map(b => b.h));

  return {
    boxes: boxes.length,
    l: maxL, w: maxW, h: maxH,
    nw: Math.round(tn * 10) / 10,
    gw: Math.round(tg * 10) / 10,
    cbm: tc,
    charge: tq,
    detail: boxes,
    pieces: col.letters,
    powers: col.powers,
    info: {kind: kind, div: div, stacked: stack, fell: fell, fixed: fixed, heavyBox: (boxes[0] && boxes[0].heavyBox) || false, estPsu: col.estPsu, quotedPsu: col.quotedPsu, powers: col.powers}
  };
}

function applyEstimate(auto){
  const isAuto = auto === true;
  const e = estimatePack();
  if(!e){
    if(isAuto){
      // 报价单里没有货了：把上一次估算留下的尺寸/重量一起清掉
      state.pack.multi = []; state.pack.info = null;
      state.pack.boxes = 1; state.pack.l = 0; state.pack.w = 0; state.pack.h = 0; state.pack.nw = 0; state.pack.gw = 0;
      syncPackUI();
    }
    else toast('报价单里还没有可估算的货物');
    return;
  }
  state.pack.boxes = e.boxes;
  state.pack.l = e.l;
  state.pack.w = e.w;
  state.pack.h = e.h;
  state.pack.nw = e.nw;
  state.pack.gw = e.gw;
  state.pack.multi = e.detail;
  state.pack.info = e.info;
  if(!isAuto) state.pack.open = true;
  syncPackUI();
  save();
  if(!isAuto) toast('已估算：' + e.pieces + ' 件 → ' + e.boxes + ' 箱');
}

/* 包装汇总：有估算结果按每箱累加，手填的按 箱数×单箱 */
function packSummary(){
  const p = state.pack;
  const m = p.multi;
  if(m && m.length){
    const sum = f => m.reduce((s, b) => s + f(b), 0);
    const dims = m.map(b => b.l + '×' + b.w + '×' + b.h).filter((v, i, arr) => arr.indexOf(v) === i).join(' / ');
    return {
      boxes: m.length, dims: dims,
      cbm: sum(b => b.cbm), nw: sum(b => b.net), gw: sum(b => b.gross), charge: sum(b => b.charge),
      div: (p.info && p.info.div) || +p.divisor || 5000,
      kind: (p.info && p.info.kind) || p.mat || 'crate'
    };
  }
  const r = calcPack();
  if(!r) return null;
  return {
    boxes: r.boxes, dims: r.l + '×' + r.w + '×' + r.h,
    cbm: r.cbm, nw: r.nw, gw: r.gw, charge: r.charge, div: r.div, kind: p.mat || 'crate'
  };
}

/* 发给货代的询价文本 */
function freightText(){

    state.items.filter(i => i.d && i.d.mode !== 'qty').map(i => i.name.split(' · ')[0])
  )].join('、');

  lines.push('目的地：');
  lines.push('');
  lines.push('运输：' + (state.incoterm || 'DDP') + '双清包税 门到门　海运空运两种价格和时效，谢谢');

function copyFreight(){

      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选中'); }
      ta.remove();
    });

    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();

    ta.remove();

}

function calcPack(){
  const p = state.pack;
  const boxes = Math.max(0, +p.boxes || 0);
  const l = Math.max(0, +p.l || 0);
  const w = Math.max(0, +p.w || 0);
  const h = Math.max(0, +p.h || 0);
  const nw = Math.max(0, +p.nw || 0);
  const gw = Math.max(0, +p.gw || 0);
  const div = Math.max(1000, +p.divisor || 5000);
  if(!boxes || !l || !w || !h) return null;
  const cbm = boxes * l * w * h / 1000000;
  const volW = boxes * l * w * h / div;
  const charge = Math.max(gw, volW);
  return {boxes: boxes, l: l, w: w, h: h, nw: nw, gw: gw, cbm: cbm, volW: volW, charge: charge, div: div, byVol: volW > gw};
}

function renderPack(){
  const box = $('#pkResult');
  if(!box) return;

  // 有估算结果时按每箱显示
  const multi = state.pack.multi;
  if(multi && multi.length){
    const info = state.pack.info || {};
    let cbm = 0, charge = 0, gw = 0, nw = 0;
    let rows = '';
    multi.forEach((b, i) => {
      cbm += b.cbm; charge += b.charge; gw += b.gross; nw += b.net;
      const _overH = (b.h > PKG.maxH) ? ' <span style="color:#d93a2b">⚠ 超 ' + PKG.maxH + 'cm</span>' : '';
      rows += '<div class="pk-box">箱' + (i + 1) + '　' + b.l + '×' + b.w + '×' + b.h + 'cm' + _overH + '　' + b.count + ' 件' +
        (b.over ? ' <span style="color:#d93a2b">⚠ 超 ' + PKG.maxSideL + '×' + PKG.maxSideW + 'cm</span>' : '') + '<br>' +
        '　重量 ' + b.gross.toFixed(1) + 'kg' +
        '　体积重 ' + b.volWt.toFixed(1) + '　计费 <b>' + b.charge.toFixed(1) + '</b> kg（' + b.driver + '）</div>';
    });

    const notes = [];
    notes.push((info.kind === 'carton' ? '纸箱' : '木箱含叉车脚 ' + PACK_MODEL.fork + 'cm') + ' · 体积重 ÷' + (info.div || 5000));
    notes.push('英文字宽按 ' + SAFE.enRatio + '×字高 · 厚度 ×' + SAFE.thick + ' · 净重 ×' + SAFE.netPct);
    if(info.powers) notes.push('含电源/配件 ' + info.powers + ' 台' +
      (info.estPsu > info.quotedPsu ? '（按尺寸估算需要 ' + info.estPsu + ' 台电源，' + (info.quotedPsu ? '报价单里加了 ' + info.quotedPsu + ' 台，差额已计入' : '报价单里没加，已计入') + '）' : ''));
    if(info.fell) notes.push('件数超过 60，已改按叠放估算');
    if(info.fixed > 0){
      const overTxt = (multi || []).some(b => b.over) || (multi || []).some(b => b.h > PKG.maxH);
      if(overTxt){
        notes.push('<span style="color:#d93a2b">⚠ 已拆到每件一箱，但仍超出 ' + PKG.maxSideL + '×' + PKG.maxSideW + '×' + PKG.maxH + 'cm（单件本身超限）。</span>');
      } else {
        notes.push('<span style="color:var(--ink3)">按「优先 ' + info.fixed + ' 箱」估算，装不下会自动加箱。</span>');
      }
    }
    if(info.heavyBox){
      notes.push('<span style="color:#c07a3a">木箱自重超过货物 2 倍（箱子偏大），建议拆箱或改用纸箱。</span>');
    }

    box.innerHTML = rows +
      '<div style="margin-top:6px">总体积 <b>' + cbm.toFixed(3) + ' CBM</b>　总重 <b>' + gw.toFixed(1) + ' kg</b></div>' +
      '<div class="hi">总计费重 <b>' + charge.toFixed(1) + ' kg</b></div>' +
      '<div style="margin-top:6px;font-size:11px;color:var(--ink3);line-height:1.6">' + notes.join('<br>') + '</div>';
    return;
  }

  const r = calcPack();
  if(!r){
    box.innerHTML = '<span style="color:var(--ink3)">报价单里加了产品会自动估算；也可以手填箱数和单箱尺寸</span>';
    return;
  }

  box.innerHTML = `
    <div>总体积 <b>${r.cbm.toFixed(3)} CBM</b></div>
    <div>体积重 <b>${r.volW.toFixed(1)} kg</b>（长×宽×高÷${r.div}）</div>
    <div class="hi">计费重 <b>${r.charge.toFixed(1)} kg</b>${r.byVol ? '（取体积重）' : '（取毛重）'}</div>
  `;
}

function syncPackUI(){
  const p = state.pack;
  ['boxes', 'l', 'w', 'h', 'nw', 'gw'].forEach(k => {
    const el = $('#pk-' + k);
    if(el) el.value = p[k];
  });
  const body = $('#packBody');
  if(body) body.hidden = !p.open;
  const ar = $('#packArrow');
  if(ar) ar.textContent = p.open ? '收起 ▲' : '展开 ▼';
  const au = $('#pkAuto'); if(au) au.checked = p.auto !== false;
  const mt = $('#pkMat');  if(mt) mt.value = p.mat === 'carton' ? 'carton' : 'crate';
  const dv = $('#pkDiv');  if(dv) dv.value = String(+p.divisor || 5000);
  const fx = $('#pkFixed'); if(fx) fx.value = String(+p.fixedBoxes || 0);
  renderPack();
}

function bindPack(){
  const tg = $('#packToggle');
  if(tg) tg.onclick = () => {
    state.pack.open = !state.pack.open;
    syncPackUI();
    save();
  };
  const be = $('#btnEstimate');
  if(be) be.onclick = () => applyEstimate();
  const bf = $('#btnFreight');
  if(bf) bf.onclick = copyFreight;

  // 估算设置变了就重算
  const rerun = () => { save(); if(state.pack.auto !== false) applyEstimate(true); else renderPack(); };
  const stk = document.getElementById('pkStack');
  if(stk){
    stk.checked = state.pack.stack !== false;
    stk.onchange = e => { state.pack.stack = e.target.checked; rerun(); };
  }
  const au = $('#pkAuto');
  if(au) au.onchange = e => {
    state.pack.auto = e.target.checked;
    save();
    if(state.pack.auto) applyEstimate(true);
  };
  const mt = $('#pkMat');
  if(mt) mt.onchange = e => { state.pack.mat = e.target.value; rerun(); };
  const fxEl = $('#pkFixed');
  if(fxEl) fxEl.onchange = e => { state.pack.fixedBoxes = +e.target.value || 0; rerun(); };
  const dv = $('#pkDiv');
  if(dv) dv.onchange = e => { state.pack.divisor = +e.target.value || 5000; rerun(); };

  // 手动改尺寸/重量：关掉自动估算，避免被覆盖
  ['boxes', 'l', 'w', 'h', 'nw', 'gw'].forEach(k => {
    const el = $('#pk-' + k);
    if(!el) return;
    el.oninput = e => {
      state.pack[k] = +e.target.value || 0;
      state.pack.multi = [];
      state.pack.info = null;
      state.pack.auto = false;
      const a2 = $('#pkAuto'); if(a2) a2.checked = false;
      renderPack();
      save();
    };
  });
  syncPackUI();
}

/* 从历史记录里汇总每个客户的统计（去重、按最近时间排序） */
function customerStats(){
  const map = {};
  histLoad().forEach(r => {
    const c = (r.customer || '').trim();
    if(!c) return;
    if(!map[c]){
      map[c] = { name: c, count: 0, total: 0, last: 0, lastAmt: '', lastMode: 'domestic', lastRate: 7.15, lastCurrency: 'USD', lastItems: 0 };
    }
    const m = map[c];
    m.count++;
    m.total += (r.total || 0);
    const t = new Date(r.time).getTime();
    if(t > m.last){
      m.last = t;
      m.lastAmt = r.total || 0;
      m.lastMode = r.mode || 'domestic';
      m.lastRate = r.rate || 7.15;
      m.lastCurrency = r.currency || 'USD';
      m.lastItems = (r.items || []).length;
    }
  });
  return Object.values(map).sort((a, b) => b.last - a.last);
}

/* exe 版走 Python 桥存本地文件；网页版走 localStorage */
const store = {
  hasBridge(){
    return !!(window.pywebview && window.pywebview.api && window.pywebview.api.save_data);
  },
  payload(){
    return {
      mode: state.mode, rate: state.rate, customer: state.customer,
      factor: state.factor, packFee: state.packFee, cost: state.cost, freightA: state.freightA, freightB: state.freightB,
      frAMode: state.frAMode, frBMode: state.frBMode, incoterm: state.incoterm,
      frADays: state.frADays, frBDays: state.frBDays,
      items: state.items, power: state.power,
      quoteId: state.quoteId, pack: state.pack, templates: state.templates, packLog: state.packLog, pkgOverride: state.pkgOverride
    };
  },
  write(){
    const txt = JSON.stringify(this.payload());
    if(this.hasBridge()){
      try{ window.pywebview.api.save_data(txt); }catch(e){}
    }
    try{ localStorage.setItem(STORE_KEY, txt); }catch(e){}
  },
  async read(){
    if(this.hasBridge()){
      try{
        const txt = await window.pywebview.api.load_data();
        if(txt) return JSON.parse(txt);
      }catch(e){}
    }
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }
};

function save(){ store.write(); pushQuoteDebounced(); }

function applyState(d){
  if(!d) return;
  if(d.mode) state.mode = d.mode;
  if(d.rate) state.rate = d.rate;
  if(d.customer) state.customer = d.customer;

  if(d.packFee) state.packFee = d.packFee;
  if(d.cost) state.cost = d.cost;
  if(d.freightA) state.freightA = d.freightA;
  if(d.freightB) state.freightB = d.freightB;
  if(d.frAMode) state.frAMode = d.frAMode;
  if(d.frBMode) state.frBMode = d.frBMode;
  if(d.frADays != null) state.frADays = d.frADays;
  if(d.frBDays != null) state.frBDays = d.frBDays;
  if(d.incoterm) state.incoterm = d.incoterm;
  if(Array.isArray(d.items)) state.items = d.items;
  if(d.quoteId) state.quoteId = d.quoteId;
  if(d.power) state.power = Object.assign({gap: 3, watt: 320, load: 100, open: false}, d.power);
  if(Array.isArray(d.templates)) state.templates = d.templates;
  if(Array.isArray(d.packLog)) state.packLog = d.packLog;
  if(d.pkgOverride && typeof d.pkgOverride === 'object') state.pkgOverride = d.pkgOverride;
  if(d.pack){
    state.pack = Object.assign({open: false, boxes: 1, l: 0, w: 0, h: 0, nw: 0, gw: 0, divisor: 5000, mat: 'crate', fixedBoxes: 0, auto: true, v: 2, info: null, multi: [], stack: true}, d.pack);
    // 旧版保存的包装设置：体积重除数 6000 → 5000（宁多勿少），按新算法重新估算
    if(!d.pack.v){ state.pack.v = 2; state.pack.divisor = 5000; state.pack.mat = 'crate'; state.pack.multi = []; state.pack.info = null; }
  }
}

/* ========================= 版本检测 ========================= */
// 版本源：仓库里的 version.json，内容格式：
//   { "version": "1.22.1", "url": "下载链接", "notes": "更新说明" }
// 仓库：GitHub -> 只改 GH_REPO 这一行，下面三个镜像地址自动跟着变
const GH_REPO = 'xyxyyx933-coder/suyun-quote';
const UPDATE_SOURCES = [
  'https://cdn.jsdelivr.net/gh/' + GH_REPO + '@main/version.json',        // jsDelivr 主镜像
  'https://fastly.jsdelivr.net/gh/' + GH_REPO + '@main/version.json',   // jsDelivr 备用节点
  'https://raw.githubusercontent.com/' + GH_REPO + '/main/version.json' // GitHub 原生（部分地区不可达）
];

function verParse(s){
  const m = String(s || '').match(/(\d+)\.(\d+)\.(\d+)/);
  return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
}
function verCmp(a, b){
  for(let i = 0; i < 3; i++){
    if(a[i] !== b[i]) return a[i] - b[i];
  }
  return 0;
}

/* 检查更新：manual=true 时手动触发，会有结果提示 */
async function checkUpdate(manual){
  const local = verParse(document.body.getAttribute('data-version') || '1.0.0');
  let info = null;
  /* 依次尝试各镜像，任意一个成功即可 */
  for(const src of UPDATE_SOURCES){
    try{
      const r = await fetch(src + (src.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), {cache: 'no-store'});
      if(!r.ok) continue;
      const j = await r.json();
      if(j && j.version){ info = j; break; }
    }catch(e){ /* 换下一个镜像 */ }
  }
  if(!info){
    if(manual) toast('检测失败，请检查网络');
    return 'error';
  }

  if(!info.version){
    if(manual) toast('检测失败，版本信息无效');
    return 'error';
  }
  if(verCmp(verParse(info.version), local) <= 0){
    if(manual) toast('已是最新版本 v' + (local.join('.') || '1.0.0'));
    return 'latest';
  }

  // 有新版本：显示顶部更新提示条
  showUpdateBar(info);
  if(manual) toast('发现新版本 v' + info.version);
  return 'update';
}

function showUpdateBar(info){
  if(document.getElementById('updateBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBar';
  bar.innerHTML = `
    <span class="ub-icon">🆕</span>
    <span class="ub-text">有新版本 <b>v${info.version || ''}</b>${info.notes ? ' · ' + info.notes : ''}</span>
    <button class="ub-btn" id="ubDownload">下载更新</button>
    <button class="ub-close" id="ubClose" title="关闭">×</button>`;
  document.body.appendChild(bar);

  const dl = bar.querySelector('#ubDownload');
  if(dl && info.url) dl.onclick = () => {
    try{ window.open(info.url, '_blank'); }catch(e){}
  };
  const cl = bar.querySelector('#ubClose');
  if(cl) cl.onclick = () => bar.remove();
}

/* ========================= 苏运算主程序桥接 =========================
   本页内嵌在 苏运算.html 的 iframe 中运行：
   1) 父页面切到「汇总报价单」时发 suyin:reqQuote，本页回 suyin:quoteData
   2) 「带入运费计算」把包装尺寸 / 毛重发给父页面并自动跳转
   3) 父页面算完运费会推 suyin:freightData，可一键填进双物流报价 A/B
   ================================================================ */
let pushTimer = null;
function pushQuote(){
  try{
    if(!(window.parent && window.parent !== window)) return;
    const sub = state.items.reduce((s, it) => s + it.amount, 0);
    const fee = getPackFee();
    const f = getFactor();
    const after = (sub + fee) * f / 100;
    const pk = calcPack();
    window.parent.postMessage({
      type: 'suyin:quoteData',
      customer: state.customer || '',
      mode: state.mode,
      cur: curCode(),
      rate: state.rate,
      factor: f,
      packFee: fee,
      items: state.items.map(it => ({
        name: it.name, en: it.en || '',
        spec: it.spec || '', formula: it.formula || '',
        amount: Math.round(it.amount * 100) / 100
      })),
      sub: Math.round(sub * 100) / 100,
      after: Math.round(after * 100) / 100,
      gift: after >= 1000 && sub > 0,
      pack: pk ? {boxes: pk.boxes, l: pk.l, w: pk.w, h: pk.h,
                  nw: pk.nw, gw: pk.gw, cbm: +pk.cbm.toFixed(3)} : null
    }, '*');
  }catch(e){}
}
function pushQuoteDebounced(){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushQuote, 120);
}
window.addEventListener('message', e => {
  const d = e.data;
  if(!d || !d.type) return;
  if(d.type === 'suyin:reqQuote') pushQuote();
  else if(d.type === 'suyin:freightData') onFreightData(d);
});

/* ---- 带入运费计算 ---- */
function gotoFreight(){
  if(!state.items.length){ toast('报价单还是空的，先加产品算出价格'); return; }
  const p = state.pack;
  /* 包装没填全 → 自动按产品尺寸估算一次 */
  if(!(p.boxes > 0 && p.l > 0 && p.w > 0 && p.h > 0 && p.gw > 0)){
    const e = estimatePack();
    if(!e){ toast('报价单里没有可估算的货物尺寸'); return; }
    state.pack.boxes = e.boxes;
    state.pack.l = e.l;
    state.pack.w = e.w;
    state.pack.h = e.h;
    state.pack.nw = e.nw;
    state.pack.gw = e.gw;
    state.pack.crate = e.info ? e.info.kind === 'crate' : true;
    state.pack.open = true;
    syncPackUI();
    save();
    toast(`已按产品自动估算：${e.boxes} 箱`);
  }
  const pk = calcPack();
  if(!pk || !(pk.gw > 0)){ toast('包装信息不完整，请补全毛重'); return; }
  const payload = {
    type: 'suyin:gotoFreight',
    boxes: pk.boxes,
    l: pk.l, w: pk.w, h: pk.h,
    nw: pk.nw, gw: Math.round(pk.gw * 10) / 10,
    cbm: +pk.cbm.toFixed(3),
    charge: +pk.charge.toFixed(1)
  };
  try{
    if(window.parent && window.parent !== window){
      window.parent.postMessage(payload, '*');
      toast('已带入尺寸重量，正在跳到运费计算…');
    } else {
      toast('请在「苏运算」主窗口的「产品报价」页使用此功能');
    }
  }catch(err){
    toast('跳转失败，可点「复制发货信息给货代」手动询价');
  }
}

      window.parent.postMessage({type: 'suyin:gotoSheet'}, '*');
      toast('正在打开汇总报价单…');

      toast('请在「苏运算」主窗口的「产品报价」页使用此功能');

/* ---- 接收主程序运费计算结果，填进双物流报价 ---- */
function onFreightData(d){
  if(!d || !Array.isArray(d.rows) || !d.rows.length) return;
  window._lastFreightRows = d.rows;
  const A = $('#frA'), B = $('#frB');
  /* 两个运费都是空时自动填一次；否则等用户点按钮 */
  if(A && B && !(+A.value > 0) && !(+B.value > 0)) fillFreightOptions(true);
}
function mapFrMode(m){
  return m === 'sea' ? 'sea' : m === 'air' ? 'air' : 'dhl';
}
function fillFreightOptions(silent){
  const rows = window._lastFreightRows;
  if(!rows || !rows.length){ if(!silent) toast('还没有运费数据：先到「国际运费报价」算一次'); return; }
  const fire = el => { if(el) el.dispatchEvent(new Event('input', {bubbles:true})); };
  const sea = rows.find(r => r.mode === 'sea') || rows[0];
  const air = rows.find(r => r.mode === 'air') || rows.find(r => r.mode === 'exp') || rows[rows.length - 1];
  const ea = $('#frA'), eb = $('#frB');
  if(sea){ $('#frAMode').value = mapFrMode(sea.mode); if($('#frADays')) $('#frADays').value = sea.days || ''; ea.value = Math.round(sea.total); fire(ea); }
  if(air){ $('#frBMode').value = mapFrMode(air.mode); if($('#frBDays')) $('#frBDays').value = air.days || ''; eb.value = Math.round(air.total); fire(eb); }
  save();
  if(!silent) toast(`已填入：A ${sea ? sea.name + ' ¥' + Math.round(sea.total) : '—'} / B ${air ? air.name + ' ¥' + Math.round(air.total) : '—'}`);
}
$('#btnGotoFreight').onclick = gotoFreight;
$('#btnGotoSheet').onclick = gotoSheet;
$('#btnFillFreight').onclick = () => fillFreightOptions(false);
pushQuote();   // 启动先推一次

</script>

<script src="xlsx.full.min.js"></script>
